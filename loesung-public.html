<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lösungsdetails | ehealth Sales GmbH</title>
<meta name="description" content="Detailseite zu einem Produkt oder einer Lösung von ehealth Sales GmbH">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  :root {
    --navy: #3C4A7C; --navy-dark: #2d3a63; --green: #6DC52D; --green-dark: #59A322;
    --gray-50: #F8F9FF; --gray-100: #EEF1F8; --gray-200: #D9DFEE;
    --gray-400: #94a3b8; --gray-500: #6B7280; --gray-700: #374151; --gray-900: #111827;
    --shadow-sm: 0 1px 3px rgba(60,74,124,0.08); --shadow-md: 0 4px 16px rgba(60,74,124,0.12);
  }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--gray-50); color: var(--gray-900); line-height: 1.6; }
  a { text-decoration: none; color: inherit; }
  img { max-width: 100%; }

  /* Nav */
  .nav { background: var(--navy); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
  .nav-inner { max-width: 1180px; margin: 0 auto; padding: 0 24px; height: 72px; display: flex; align-items: center; justify-content: space-between; }
  .nav-logo { display: flex; align-items: center; gap: 12px; }
  .nav-logo img { height: 36px; border-radius: 6px; }
  .nav-logo-text { font-family: Montserrat, sans-serif; font-weight: 800; font-size: 1rem; color: white; }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .btn-nav-back { background: rgba(255,255,255,0.12); color: white; border: none; border-radius: 8px; padding: 8px 16px; font-size: 0.82rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 7px; font-family: inherit; }
  .btn-nav-back:hover { background: rgba(255,255,255,0.22); }
  .btn-nav-contact { background: var(--green); color: white; border: none; border-radius: 8px; padding: 8px 18px; font-size: 0.82rem; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-nav-contact:hover { background: var(--green-dark); }

  /* Page */
  .page-wrap { max-width: 900px; margin: 0 auto; padding: 48px 24px 80px; }

  /* Breadcrumb */
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--gray-400); margin-bottom: 32px; }
  .breadcrumb a { color: var(--navy); font-weight: 600; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb span { font-size: 0.78rem; }

  /* Hero */
  .hero { background: white; border-radius: 20px; box-shadow: var(--shadow-md); margin-bottom: 32px; display: flex; align-items: center; gap: 28px; padding: 28px 32px; }
  .hero-img { width: 100px; height: 100px; border-radius: 12px; flex-shrink: 0; overflow: hidden; background: var(--gray-100); display: flex; align-items: center; justify-content: center; }
  .hero-img img { width: 100%; height: 100%; object-fit: cover; }
  .hero-img-placeholder { color: var(--gray-400); display: flex; align-items: center; justify-content: center; }
  .hero-img-placeholder svg { width: 40px; height: 40px; opacity: 0.5; }
  .hero-name-block { flex: 1; min-width: 0; }
  .hero-hersteller { font-size: 0.84rem; color: var(--gray-400); margin-top: 4px; }
  .hero-title { font-family: Montserrat, sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--navy); line-height: 1.2; }
  .hero-tags { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
  .hero-tag { font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .hero-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex-shrink: 0; min-width: 160px; align-self: flex-end; }
  .btn-primary { background: var(--navy); color: white; border: none; border-radius: 10px; padding: 13px 26px; font-size: 0.88rem; font-weight: 700; cursor: pointer; font-family: inherit; display: inline-block; }
  .btn-primary:hover { background: var(--navy-dark); }
  .btn-outline { background: transparent; color: var(--navy); border: 2px solid var(--navy); border-radius: 10px; padding: 11px 24px; font-size: 0.88rem; font-weight: 700; cursor: pointer; font-family: inherit; display: inline-block; }
  .btn-outline:hover { background: var(--navy); color: white; }
  .btn-primary { background: var(--navy); color: white; border: none; border-radius: 10px; padding: 13px 26px; font-size: 0.88rem; font-weight: 700; cursor: pointer; font-family: inherit; display: inline-block; }
  .btn-primary:hover { background: var(--navy-dark); }
  .btn-outline { background: transparent; color: var(--navy); border: 2px solid var(--navy); border-radius: 10px; padding: 11px 24px; font-size: 0.88rem; font-weight: 700; cursor: pointer; font-family: inherit; display: inline-block; }
  .btn-outline:hover { background: var(--navy); color: white; }

  /* Teaser */
  .teaser { background: var(--navy); color: white; border-radius: 16px; padding: 36px 40px; margin-bottom: 28px; }
  .teaser-label { font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 10px; }
  .teaser-text { font-size: 1.15rem; line-height: 1.8; color: rgba(255,255,255,0.9); }

  /* Sections */
  .content-card { background: white; border-radius: 16px; padding: 32px 36px; margin-bottom: 24px; box-shadow: var(--shadow-sm); }
  .section-label { font-size: 0.7rem; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 8px; }
  .section-title { font-family: Montserrat, sans-serif; font-size: 1.25rem; font-weight: 800; color: var(--navy); margin-bottom: 16px; }
  .desc-text { font-size: 0.94rem; line-height: 1.9; color: var(--gray-700); white-space: pre-wrap; }

  /* Features */
  .features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .feature-item { display: flex; align-items: flex-start; gap: 12px; background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 10px; padding: 14px 16px; }
  .feature-check { width: 22px; height: 22px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .feature-check svg { width: 12px; height: 12px; stroke: white; }
  .feature-text { font-size: 0.875rem; font-weight: 500; color: var(--gray-700); line-height: 1.4; }

  /* CTA */
  .cta-card { background: linear-gradient(135deg, var(--navy) 0%, #2A3460 100%); border-radius: 16px; padding: 40px; display: flex; align-items: center; justify-content: space-between; gap: 32px; margin-bottom: 24px; }
  .cta-text h2 { font-family: Montserrat, sans-serif; font-size: 1.2rem; font-weight: 800; color: white; margin-bottom: 6px; }
  .cta-text p { font-size: 0.85rem; color: rgba(255,255,255,0.7); margin: 0; }
  .btn-cta { background: var(--green); color: white; border: none; border-radius: 10px; padding: 14px 28px; font-size: 0.92rem; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; display: inline-block; }
  .btn-cta:hover { background: var(--green-dark); }

  /* Footer hint */
  .footer-hint { text-align: center; color: var(--gray-400); font-size: 0.85rem; padding: 8px; }
  .footer-hint a { color: var(--navy); font-weight: 600; }
  .footer-hint a:hover { text-decoration: underline; }

  /* States */
  .loading { text-align: center; padding: 80px; color: var(--gray-400); font-size: 0.9rem; }
  .error-card { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-radius: 12px; padding: 28px; text-align: center; }
  .error-card a { color: var(--navy); font-weight: 600; }

  @media (max-width: 700px) {
    .hero { flex-wrap: wrap; padding: 20px; gap: 16px; }
    .hero-actions { align-items: flex-start; width: 100%; }
    .hero-tags { justify-content: flex-start; }
    .hero-title { font-size: 1.5rem; }
    .features-grid { grid-template-columns: 1fr; }
    .cta-card { flex-direction: column; text-align: center; }
    .teaser { padding: 28px 24px; }
  }
</style>
</head>
<body>

<!-- Navigation -->
<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo">
      <img src="ehs-logo.jpg" alt="eHS" onerror="this.style.display='none'">
      <span class="nav-logo-text">ehealth Sales GmbH</span>
    </div>
    <div class="nav-right">
      <button class="btn-nav-back" onclick="history.back()">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Zurück
      </button>
      <a href="index.html#kontakt" class="btn-nav-contact">Beratung anfragen</a>
    </div>
  </div>
</nav>

<div class="page-wrap">

  <!-- Breadcrumb -->
  <div class="breadcrumb">
    <a href="index.html">Startseite</a>
    <span>›</span>
    <a href="index.html?open=loesungen">Lösungen</a>
    <span>›</span>
    <span id="breadcrumb-name">Lösungsdetail</span>
  </div>

  <div id="page-content">
    <div class="loading">Seite wird geladen…</div>
  </div>

</div>

<script>
  const SB_URL  = 'https://focysklymhmcfwgxdtuk.supabase.co';
  const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvY3lza2x5bWhtY2Z3Z3hkdHVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NTY1NTUsImV4cCI6MjEwMzEzMjU1NX0.VxgHwrnFUd-_7Q3pZx0L-7xY5roBZ__rUnLc5W7lOgg';
  const sb = supabase.createClient(SB_URL, SB_ANON);

  const THEMEN = {
    ti:               { label: 'Telematik Infrastruktur', color: '#3C4A7C' },
    security:         { label: 'Cybersecurity',           color: '#E53E3E' },
    telemedizin:      { label: 'Telemedizin',             color: '#38B2AC' },
    it_infrastruktur: { label: 'IT Infrastruktur',        color: '#4299E1' },
    modern_work:      { label: 'Modern Work',             color: '#6DC52D' },
    prozess_digital:  { label: 'Prozess Digitalisierung', color: '#ED8936' },
  };

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    if (!productId) { showError('Kein Produkt angegeben. <a href="index.html">Zurück zur Startseite</a>'); return; }

    const { data: product, error } = await sb.from('products')
      .select('*')
      .eq('id', productId)
      .eq('published', true)
      .single();

    if (error || !product) {
      showError('Produkt nicht gefunden oder nicht veröffentlicht. <a href="index.html">Zurück zur Startseite</a>');
      return;
    }
    if (!product.loesung_aktiv || !product.loesung_inhalt) {
      showError('Für dieses Produkt gibt es noch keine Lösungsseite. <a href="index.html">Zur Startseite</a>');
      return;
    }

    document.title = `${product.produkt} | ehealth Sales GmbH`;
    document.querySelector('meta[name="description"]').setAttribute('content',
      product.loesung_inhalt?.teaser || product.beschreibung || '');
    document.getElementById('breadcrumb-name').textContent = product.produkt;

    renderPage(product);
  }

  function renderPage(p) {
    const inhalt = p.loesung_inhalt || {};
    const themenTags = Object.entries(THEMEN)
      .filter(([k]) => p[k])
      .map(([, t]) => `<span class="hero-tag" style="background:${t.color}18;color:${t.color};border:1px solid ${t.color}33">${t.label}</span>`)
      .join('');

    const vorteile = (inhalt.vorteile || []).filter(Boolean);
    const hatBeschreibung = !!(inhalt.beschreibung || '').trim();
    const hatVorteile = vorteile.length > 0;
    const hatCta = !!(inhalt.cta_url || '').trim() && !!(inhalt.cta_text || '').trim();

    document.getElementById('page-content').innerHTML = `

      <!-- Hero -->
      <div class="hero">
        <div class="hero-img">
          ${p.image_url
            ? `<img src="${p.image_url}" alt="${esc(p.produkt)}" onerror="this.parentElement.innerHTML='<div class=hero-img-placeholder><svg fill=none viewBox=&quot;0 0 24 24&quot; stroke=currentColor stroke-width=1.5><path stroke-linecap=round stroke-linejoin=round d=&quot;M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z&quot;/></svg></div>'">`
            : `<div class="hero-img-placeholder"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>`}
        </div>
        <div class="hero-name-block">
          <h1 class="hero-title">${esc(p.produkt)}</h1>
          ${p.hersteller ? `<div class="hero-hersteller">von ${esc(p.hersteller)}</div>` : ''}
          ${themenTags ? `<div class="hero-tags" style="margin-top:12px;">${themenTags}</div>` : ''}
        </div>
        <div class="hero-actions">
          <a href="admin/index.html" class="btn-primary">Im Portal bestellen</a>
          <a href="index.html?open=kontakt" class="btn-outline">Beratung anfragen</a>
        </div>
      </div>

      <!-- Teaser -->
      ${inhalt.teaser ? `
      <div class="teaser">
        <div class="teaser-label">Auf einen Blick</div>
        <div class="teaser-text">${esc(inhalt.teaser)}</div>
      </div>` : ''}

      <!-- Beschreibung -->
      ${hatBeschreibung ? `
      <div style="padding: 8px 4px 24px;">
        <div class="section-label">Über das Produkt</div>
        <p class="desc-text" style="margin-top:10px;">${esc(inhalt.beschreibung)}</p>
      </div>` : ''}

      <!-- Vorteile -->
      ${hatVorteile ? `
      <div class="content-card">
        <div class="section-label">Ihre Vorteile</div>
        <div class="features-grid">
          ${vorteile.flatMap(v => v.split('#').map(s => s.trim()).filter(Boolean)).map(v => `
          <div class="feature-item">
            <div class="feature-check">
              <svg fill="none" viewBox="0 0 12 12" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2 6l3 3 5-5"/></svg>
            </div>
            <span class="feature-text">${esc(v)}</span>
          </div>`).join('')}
        </div>
      </div>` : ''}

      <!-- CTA -->
      ${hatCta ? `
      <div class="cta-card">
        <div class="cta-text">
          <h2>Bereit für den nächsten Schritt?</h2>
          <p>Jetzt mehr Informationen erhalten oder direkt loslegen.</p>
        </div>
        <a href="${escAttr(inhalt.cta_url)}" target="_blank" rel="noopener noreferrer" class="btn-cta">${esc(inhalt.cta_text)}</a>
      </div>` : ''}

      <div class="footer-hint">
        Fragen zum Produkt?
        <a href="index.html?open=kontakt">Schreiben Sie uns →</a>
      </div>
    `;
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(str) {
    return String(str || '').replace(/"/g,'&quot;');
  }

  function showError(html) {
    document.getElementById('page-content').innerHTML = `<div class="error-card">${html}</div>`;
  }

  init();
</script>
</body>
</html>
