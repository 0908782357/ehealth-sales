name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: GitHub Release erstellen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "Release ${{ github.ref_name }}"
