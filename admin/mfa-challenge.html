<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHS Portal – 2FA Verifikation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #3C4A7C; --green: #6DC52D; --navy-dark: #2d3a63;
    --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
    --gray-400: #94a3b8; --gray-500: #64748b; --gray-900: #0f172a;
    --red: #ef4444;
  }
  body {
    font-family: 'Inter', 'Helvetica Neue', sans-serif;
    background: var(--gray-50); color: var(--gray-900);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: white; border-radius: 20px; width: 100%; max-width: 420px;
    padding: 40px 40px 36px; box-shadow: 0 8px 40px rgba(60,74,124,0.12);
    border: 1.5px solid var(--gray-200);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .brand img { height: 36px; border-radius: 8px; }
  .brand-name { font-family: Montserrat, sans-serif; font-size: 1rem; font-weight: 800; color: var(--navy); }
  h1 { font-family: Montserrat, sans-serif; font-size: 1.3rem; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
  .subtitle { font-size: 0.85rem; color: var(--gray-400); margin-bottom: 28px; line-height: 1.5; }
  .icon-wrap {
    width: 56px; height: 56px; border-radius: 14px; background: #eef0f7;
    display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
  }
  .icon-wrap svg { width: 28px; height: 28px; color: var(--navy); }
  .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
  .form-group label { font-size: 0.72rem; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.06em; }
  .code-input {
    border: 1.5px solid var(--gray-200); border-radius: 10px; padding: 14px 16px;
    font-size: 1.6rem; font-weight: 700; letter-spacing: 0.3em; text-align: center;
    font-family: 'Courier New', monospace; outline: none; transition: border 0.15s; width: 100%;
  }
  .code-input:focus { border-color: var(--navy); }
  .btn {
    width: 100%; padding: 12px; background: var(--navy); color: white;
    border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: background 0.15s; margin-top: 8px;
  }
  .btn:hover { background: var(--navy-dark); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-secondary {
    background: none; color: var(--gray-500); border: 1.5px solid var(--gray-200); margin-top: 8px;
  }
  .btn-secondary:hover { background: var(--gray-100); color: var(--navy); }
  .msg { display: none; padding: 10px 14px; border-radius: 9px; font-size: 0.82rem; margin-top: 14px; }
  .msg.error   { display: block; background: #fef2f2; color: var(--red); }
  .msg.success { display: block; background: #f0fdf4; color: #16a34a; }
  .loading { text-align: center; color: var(--gray-400); font-size: 0.85rem; padding: 20px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img src="../ehs-logo.jpg" alt="EHS" onerror="this.style.display='none'">
    <span class="brand-name">eHS Kunden Portal</span>
  </div>

  <div id="loading-state" class="loading">Wird geladen…</div>

  <div id="main-state" style="display:none">
    <div class="icon-wrap">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
    <h1>Zwei-Faktor-Authentifizierung</h1>
    <p class="subtitle">Geben Sie den 6-stelligen Code aus Ihrer Authenticator-App ein.</p>

    <div class="form-group">
      <label>Bestätigungscode</label>
      <input type="text" id="totp-code" class="code-input" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
    </div>

    <button class="btn" id="verify-btn" onclick="verifyMfa()">Bestätigen</button>
    <button class="btn btn-secondary" onclick="doLogout()">Abmelden</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
  const sb = supabase.createClient(
    'https://focysklymhmcfwgxdtuk.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvY3lza2x5bWhtY2Z3Z3hkdHVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NTY1NTUsImV4cCI6MjEwMzEzMjU1NX0.VxgHwrnFUd-_7Q3pZx0L-7xY5roBZ__rUnLc5W7lOgg',
    { auth: { flowType: 'implicit' } }
  );

  let factorId = null;
  let challengeId = null;

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }

    const { data: { currentLevel, nextLevel } } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if (currentLevel === 'aal2') {
      // Bereits verifiziert → weiterleiten
      goNext(); return;
    }
    if (nextLevel !== 'aal2') {
      // Kein MFA erforderlich → weiterleiten
      goNext(); return;
    }

    // Factor laden und Challenge starten
    const { data: factors } = await sb.auth.mfa.listFactors();
    const factor = factors?.totp?.[0];
    if (!factor) { goNext(); return; }

    factorId = factor.id;
    const { data: challenge, error } = await sb.auth.mfa.challenge({ factorId });
    if (error) { showMsg('Fehler beim Starten der 2FA: ' + error.message, 'error'); return; }
    challengeId = challenge.id;

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('main-state').style.display = '';
    document.getElementById('totp-code').focus();
  }

  async function verifyMfa() {
    const code = document.getElementById('totp-code').value.trim().replace(/\s/g, '');
    if (code.length !== 6) { showMsg('Bitte einen 6-stelligen Code eingeben.', 'error'); return; }

    const btn = document.getElementById('verify-btn');
    btn.disabled = true; btn.textContent = 'Wird geprüft…';

    const { error } = await sb.auth.mfa.verify({ factorId, challengeId, code });
    if (error) {
      showMsg('Code ungültig oder abgelaufen. Bitte erneut versuchen.', 'error');
      btn.disabled = false; btn.textContent = 'Bestätigen';
      document.getElementById('totp-code').value = '';
      document.getElementById('totp-code').focus();
      // Neue Challenge starten für nächsten Versuch
      const { data: newChallenge } = await sb.auth.mfa.challenge({ factorId });
      if (newChallenge) challengeId = newChallenge.id;
      return;
    }

    showMsg('Verifiziert! Sie werden weitergeleitet…', 'success');
    setTimeout(() => goNext(), 800);
  }

  function goNext() {
    const next = sessionStorage.getItem('mfa_next') || 'dashboard.html';
    sessionStorage.removeItem('mfa_next');
    window.location.href = next;
  }

  async function doLogout() {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text; el.className = 'msg ' + type;
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') verifyMfa();
  });

  // Auto-submit wenn 6 Zeichen eingegeben
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('totp-code')?.addEventListener('input', e => {
      if (e.target.value.replace(/\s/g,'').length === 6) verifyMfa();
    });
  });

  init();
</script>
</body>
</html>
