<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alliance Portal – Kampagnen-Report</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="perm.js"></script>
<script src="nav.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #3C4A7C; --navy-dark: #2d3a63; --green: #6DC52D;
    --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
    --gray-400: #94a3b8; --gray-500: #64748b; --gray-700: #374151; --gray-900: #0f172a;
    /* Report-Blatt im eHS-CI */
    --ci-navy: #0E2841; --ci-navy-2: #17375A; --ci-paper: #F6F7F9; --ci-ink: #1B2430; --ci-muted: #4A5568;
    --ci-green: #7FD35B; --ci-on-dark: #F4F6F9; --ci-on-dark-2: #BFCCDB; --ci-line: #E3E7ED;
    /* Kanal-Farben (validiert: Lightness, Chroma, CVD, Kontrast – alle PASS) */
    --k-instagram: #E55137; --k-newsletter: #1A73B8; --k-direkt: #1E9C8A; --k-sonstige: #8A94A3;
  }
  body { font-family: 'Inter','Helvetica Neue',sans-serif; background: var(--gray-50); color: var(--gray-900); }

  .topbar { background: var(--navy); color: white; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  .topbar-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1rem; }
  .topbar-brand img { height: 32px; border-radius: 6px; }
  .topbar-brand span { opacity: 0.7; font-weight: 400; font-size: 0.78rem; margin-left: 4px; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .user-chip { background: rgba(255,255,255,0.12); border-radius: 20px; padding: 5px 12px; font-size: 0.78rem; }
  .btn-logout { background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 8px; padding: 7px 14px; font-size: 0.78rem; cursor: pointer; }
  .layout { display: flex; min-height: calc(100vh - 60px); }
  .sidebar { width: 220px; flex-shrink: 0; background: white; border-right: 1px solid var(--gray-200); padding: 24px 12px; }
  .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: var(--gray-500); font-size: 0.85rem; font-weight: 500; text-decoration: none; transition: all 0.15s; }
  .nav-link:hover { background: var(--gray-100); color: var(--navy); }
  .nav-link.active { background: #eef0f7; color: var(--navy); font-weight: 700; }
  .nav-group-header { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: var(--gray-500); font-size: 0.85rem; font-weight: 600; cursor: pointer; user-select: none; }
  .nav-group-header:hover { background: var(--gray-100); color: var(--navy); }
  .nav-group-header > svg:first-child { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-group-header > span { flex: 1; }
  .nav-chevron { width: 14px; height: 14px; flex-shrink: 0; transition: transform 0.2s; }
  .nav-group.open .nav-chevron { transform: rotate(90deg); }
  .nav-group-body { display: none; }
  .nav-group.open .nav-group-body { display: block; }
  .nav-sub { padding-left: 28px !important; }
  .nav-subgroup-label { font-size: 0.62rem; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.1em; padding: 6px 10px 4px 28px; }
  .nav-sub2 { padding-left: 40px !important; }
  .nav-link svg { width: 16px; height: 16px; flex-shrink: 0; }

  .main { flex: 1; padding: 32px 36px; overflow: auto; min-width: 0; }
  h1 { font-family: Montserrat, sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--navy); }
  .page-sub { color: var(--gray-400); font-size: 0.85rem; margin: 4px 0 22px; }

  /* Steuerung – eine Zeile über dem Report */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: white; border: 1px solid var(--gray-200); border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; }
  .controls label { font-size: .75rem; font-weight: 600; color: var(--gray-500); display: flex; align-items: center; gap: 6px; }
  .controls select, .controls input[type=date] { padding: 7px 10px; border: 1.5px solid var(--gray-200); border-radius: 8px; font: inherit; font-size: .84rem; background: white; color: var(--gray-900); }
  .seg { display: inline-flex; border: 1.5px solid var(--gray-200); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; background: white; padding: 7px 11px; font: inherit; font-size: .8rem; font-weight: 600; color: var(--gray-500); cursor: pointer; border-right: 1px solid var(--gray-200); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: #eef0f7; color: var(--navy); }
  .controls .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 9px; padding: 9px 14px; font: inherit; font-size: .84rem; font-weight: 700; cursor: pointer; }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--ci-navy); color: white; }
  .btn-primary:hover { background: var(--ci-navy-2); }
  .btn-ghost { background: var(--gray-100); color: var(--navy); }
  .btn-ghost:hover { background: var(--gray-200); }

  /* ── Report-Blatt ── */
  .sheet { background: white; max-width: 980px; margin: 0 auto; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px -18px rgba(14,40,65,.35); border: 1px solid var(--ci-line); color: var(--ci-ink); }
  .sheet-head { background: var(--ci-navy); color: var(--ci-on-dark); padding: 30px 36px 28px; display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
  .eyebrow { font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ci-green); }
  .sheet-head h2 { font-family: 'ADLaM Display', Georgia, serif; font-weight: 400; font-size: 2rem; line-height: 1.1; margin: 8px 0 6px; }
  .sheet-head p { color: var(--ci-on-dark-2); font-size: .9rem; }
  .sheet-brand { display: flex; align-items: center; gap: 12px; color: var(--ci-on-dark); font-weight: 700; }
  .sheet-brand img { height: 30px; }
  .sheet-brand .x { color: var(--ci-on-dark-2); font-weight: 400; }
  .ivoris-word { font-size: 1.35rem; letter-spacing: -.02em; }
  .ivoris-word sup { font-size: .45em; position: relative; top: -.5em; }
  .sheet-body { padding: 28px 36px 32px; background: var(--ci-paper); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .sheet-body > *, .grid-2 > * { min-width: 0; }
  .table-wrap { overflow-x: auto; }
  .card { background: white; border: 1px solid var(--ci-line); border-radius: 14px; padding: 20px 22px; break-inside: avoid; }
  .card h3 { font-family: 'ADLaM Display', Georgia, serif; font-weight: 400; font-size: 1.15rem; color: var(--ci-navy); margin-bottom: 4px; }
  .card .sub { font-size: .8rem; color: var(--ci-muted); margin-bottom: 14px; }
  .grid-2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 18px; }

  .summary textarea { width: 100%; min-height: 128px; border: 1.5px dashed var(--ci-line); border-radius: 10px; padding: 12px 14px; font: inherit; font-size: .95rem; line-height: 1.6; color: var(--ci-ink); resize: vertical; background: #fff; }
  .summary textarea:focus { outline: none; border-color: #156082; border-style: solid; }
  .summary .print-text { display: none; white-space: pre-wrap; font-size: .95rem; line-height: 1.6; }
  .summary-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: .75rem; color: var(--gray-400); }
  .link-btn { background: none; border: 0; color: #156082; font: inherit; font-size: .78rem; font-weight: 700; cursor: pointer; }

  /* KPI-Kacheln */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi { background: white; border: 1px solid var(--ci-line); border-radius: 14px; padding: 16px 18px; }
  .kpi .lbl { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ci-muted); }
  .kpi .val { font-family: 'ADLaM Display', Georgia, serif; font-size: 2.1rem; color: var(--ci-navy); line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi .hint { font-size: .76rem; color: var(--ci-muted); margin-top: 2px; }

  /* Kanal-Tabelle mit Datenbalken */
  table.kanal { width: 100%; border-collapse: collapse; font-size: .86rem; font-variant-numeric: tabular-nums; }
  table.kanal th { text-align: right; font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ci-muted); padding: 0 8px 8px; border-bottom: 1px solid var(--ci-line); }
  table.kanal th:first-child { text-align: left; padding-left: 0; }
  table.kanal td { padding: 10px 8px; border-bottom: 1px solid var(--ci-line); text-align: right; white-space: nowrap; }
  table.kanal td:first-child { text-align: left; padding-left: 0; font-weight: 600; }
  table.kanal tr:last-child td { border-bottom: 0; }
  table.kanal tfoot td { font-weight: 700; border-top: 1.5px solid var(--ci-ink); border-bottom: 0; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  .bar-cell { width: 34%; }
  .dbar { position: relative; height: 12px; background: var(--gray-100); border-radius: 4px; }
  .dbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }

  /* Split-Balken Praxistyp */
  .split { display: flex; gap: 2px; height: 22px; margin: 6px 0 12px; }
  .split i { display: block; height: 100%; }
  .split i:first-child { border-radius: 4px 0 0 4px; }
  .split i:last-child { border-radius: 0 4px 4px 0; }
  .split i:only-child { border-radius: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .82rem; color: var(--ci-ink); }
  .legend b { font-variant-numeric: tabular-nums; }

  /* horizontale Balken (Top-Lösungen) */
  .hbars { display: grid; gap: 9px; }
  .hb { display: grid; grid-template-columns: minmax(110px, 40%) 1fr 32px; gap: 10px; align-items: center; font-size: .82rem; }
  .hb span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb .track { height: 12px; }
  .hb .track i { display: block; height: 100%; background: var(--ci-navy-2); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hb b { text-align: right; font-variant-numeric: tabular-nums; }

  /* Verlauf (Small Multiples, je eigene Achse) */
  .trend { display: grid; gap: 14px; }
  .trend-title { font-size: .78rem; font-weight: 700; color: var(--ci-ink); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .trend-title span { color: var(--ci-muted); font-weight: 500; }
  .trend svg { width: 100%; height: 90px; display: block; overflow: visible; }
  .trend .axis { font-size: 10px; fill: var(--ci-muted); }
  .empty { color: var(--ci-muted); font-size: .85rem; padding: 6px 0; }
  .note { font-size: .74rem; color: var(--ci-muted); line-height: 1.55; }
  .sheet-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .72rem; color: var(--ci-muted); padding: 0 36px 22px; background: var(--ci-paper); }

  #tip { position: fixed; pointer-events: none; z-index: 500; background: var(--ci-navy); color: white; font-size: .78rem; padding: 7px 10px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; transition: opacity .1s; white-space: nowrap; }
  #tip b { font-variant-numeric: tabular-nums; }
  [data-tip] { cursor: default; }
  .loading { text-align: center; color: var(--gray-400); padding: 60px 0; }

  @media (max-width: 860px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: minmax(0,1fr); }
    .main { padding: 20px 16px; }
    .sheet-head, .sheet-body { padding-left: 18px; padding-right: 18px; }
    .bar-cell { display: none; }
  }

  /* ── Druck / PDF ── */
  @page { size: A4; margin: 12mm; }
  @media print {
    body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .topbar, .sidebar, .controls, .page-intro, .summary-actions, .summary textarea, #tip { display: none !important; }
    .summary .print-text { display: block; }
    .layout, .main { display: block; padding: 0; }
    .sheet { max-width: none; box-shadow: none; border: 0; border-radius: 0; }
    .sheet-body { padding: 18px 20px; }
    .sheet-head { padding: 22px 20px; }
    .kpis { grid-template-columns: repeat(4, 1fr); }
    .grid-2 { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    .bar-cell { display: table-cell; }
  }
</style>

<body>

<div class="topbar">
  <div class="topbar-brand">
    <img src="../alliance-logo.png" alt="Alliance" onerror="this.style.display='none'">
    Alliance Portal
    <span>Kampagnen-Report</span>
  </div>
  <div class="topbar-right">
    <span class="user-chip" id="user-name">–</span>
    <button class="btn-logout" onclick="sb.auth.signOut().then(()=>location.href='index.html')">Abmelden</button>

</div>

<div class="layout">
  <nav class="sidebar" id="portal-nav"></nav>

  <main class="main">
    <div class="page-intro">
      <h1>Kampagnen-Report</h1>

    </div>

    <div class="controls" id="controls" style="display:none">
      <label>Kampagne
        <select id="f-kampagne"><option value="ivoris">ivoris® · Zahnmedizin</option></select>

      <button class="btn btn-ghost" onclick="exportCsv()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>CSV</button>
      <button class="btn btn-primary" onclick="printReport()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v7H6z"/></svg>PDF für ivoris®</button>
    </div>

    <div id="report"><div class="loading">Report wird geladen…</div></div>
  </main>

<script>
const SUPABASE_URL  = 'https://focysklymhmcfwgxdtuk.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvY3lza2x5bWhtY2Z3Z3hkdHVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NTY1NTUsImV4cCI6MjEwMzEzMjU1NX0.VxgHwrnFUd-_7Q3pZx0L-7xY5roBZ__rUnLc5W7lOgg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { flowType: 'implicit' } });

// Kampagnen-Stammdaten. Neue Partner-Landingpage → hier ergänzen (+ Option im Select).
const KAMPAGNEN = {
  ivoris: { label: 'ivoris®', titel: 'Praxis-Check Zahnmedizin', srcAliases: ['ivoris', 'computer-konkret'],
            seite: 'ehealth-sales.de/computer-konkret.html', start: '2026-11-05' }
};
// Feste Kanal-Reihenfolge + Farben (nie nach Rang umfärben)
const KANAELE = [
  { id: 'instagram',  label: 'Instagram',  color: 'var(--k-instagram)' },
  { id: 'newsletter', label: 'Newsletter', color: 'var(--k-newsletter)' },
  { id: 'direkt',     label: 'Direkt / ohne Kennung', color: 'var(--k-direkt)' },
  { id: 'sonstige',   label: 'Sonstige Kanäle', color: 'var(--k-sonstige)' },
];
const KANAL_IDS = KANAELE.map(k => k.id);

let STATE = { kampagne: 'ivoris', von: null, bis: null, visits: [], anfragen: [], agg: null, summaryEdited: false };

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nf  = n => Number(n || 0).toLocaleString('de-DE');
const pct = (a, b) => b > 0 ? (a / b * 100).toLocaleString('de-DE', { maximumFractionDigits: 1, minimumFractionDigits: a / b * 100 < 10 ? 1 : 0 }) + ' %' : '–';
const dDE = d => d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const normKanal = k => { k = (k || '').toLowerCase(); if (!k) return 'direkt'; return KANAL_IDS.includes(k) ? k : 'sonstige'; };

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'index.html'; return; }
  const [{ data: roleRow }, { data: prof }] = await Promise.all([
    sb.from('user_roles').select('role, partner_tier').eq('user_id', session.user.id).maybeSingle(),
    sb.from('user_profiles').select('vorname, nachname').eq('user_id', session.user.id).maybeSingle()
  ]);
  document.getElementById('user-name').textContent = prof ? [prof.vorname, prof.nachname].filter(Boolean).join(' ') || '–' : '–';
  const role = roleRow?.role || 'partner';
  await window.initPerms(sb);
  window.enforcePage(role, roleRow?.partner_tier || null, 'kampagnen_report');
  if (role !== 'admin') { location.href = 'dashboard.html'; return; }
  const ag = document.getElementById('nav-group-admin'); if (ag) ag.style.display = '';

  document.getElementById('controls').style.display = '';
  document.querySelectorAll('#presets button').forEach(b => b.addEventListener('click', () => { setPreset(b.dataset.p); load(); }));
  ['f-von','f-bis'].forEach(id => document.getElementById(id).addEventListener('change', () => { document.querySelectorAll('#presets button').forEach(x => x.classList.remove('on')); readRange(); load(); }));
  document.getElementById('f-kampagne').addEventListener('change', e => { STATE.kampagne = e.target.value; load(); });
  document.getElementById('f-notest').addEventListener('change', () => { aggregate(); render(); });
  setPreset('30');
  load();
}

function setPreset(p) {
  document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  const today = new Date(); today.setHours(0,0,0,0);
  let von = new Date(today), bis = new Date(today);
  if (p === '7')  von.setDate(von.getDate() - 6);
  if (p === '30') von.setDate(von.getDate() - 29);
  if (p === 'month') von = new Date(today.getFullYear(), today.getMonth(), 1);
  if (p === 'lastmonth') { von = new Date(today.getFullYear(), today.getMonth() - 1, 1); bis = new Date(today.getFullYear(), today.getMonth(), 0); }
  if (p === 'all') von = parseYmd(KAMPAGNEN[STATE.kampagne].start);
  const start = parseYmd(KAMPAGNEN[STATE.kampagne].start);
  if (von < start) von = start;
  document.getElementById('f-von').value = ymd(von);
  document.getElementById('f-bis').value = ymd(bis);
  readRange();
}
function readRange() {
  STATE.von = parseYmd(document.getElementById('f-von').value);
  STATE.bis = parseYmd(document.getElementById('f-bis').value);
  if (STATE.bis < STATE.von) [STATE.von, STATE.bis] = [STATE.bis, STATE.von];
}

async function load() {
  document.getElementById('report').innerHTML = '<div class="loading">Report wird geladen…</div>';
  const k = KAMPAGNEN[STATE.kampagne];
  const fromIso = STATE.von.toISOString();
  const toEx = new Date(STATE.bis); toEx.setDate(toEx.getDate() + 1);
  const toIso = toEx.toISOString();
  const [v, a] = await Promise.all([
    sb.from('kampagnen_besuche').select('created_at, kanal, ereignis').eq('kampagne', STATE.kampagne)
      .gte('created_at', fromIso).lt('created_at', toIso).limit(50000),
    sb.from('anfragen').select('created_at, name, email, berufsgruppe, produkte, nachricht')
      .ilike('nachricht', '[Quelle: Landingpage %').gte('created_at', fromIso).lt('created_at', toIso).limit(5000)
  ]);
  if (v.error || a.error) {
    document.getElementById('report').innerHTML = `<div class="loading">Daten konnten nicht geladen werden: ${esc((v.error || a.error).message)}</div>`;
    return;
  }
  STATE.visits = v.data || [];
  // Quelle aus dem Anfrage-Vermerk lesen: [Quelle: Landingpage <kampagne>[-<kanal>]]
  STATE.anfragen = (a.data || []).map(r => {
    const m = /^\[Quelle: Landingpage ([a-z0-9-]+)\]/i.exec(r.nachricht || '');
    if (!m) return null;
    const src = m[1].toLowerCase();
    const alias = k.srcAliases.find(al => src === al || src.startsWith(al + '-'));
    if (!alias) return null;
    return { ...r, kanal: normKanal(src.slice(alias.length + 1)) };
  }).filter(Boolean);
  STATE.summaryEdited = false;
  aggregate();
  render();
}

function aggregate() {
  const noTest = document.getElementById('f-notest').checked;
  const anfr = STATE.anfragen.filter(r => !noTest || !/test/i.test((r.name || '') + ' ' + (r.email || '')));
  const per = Object.fromEntries(KANAL_IDS.map(id => [id, { besuch: 0, finder_start: 0, anfragen: 0 }]));
  STATE.visits.forEach(r => { const c = per[normKanal(r.kanal)]; if (c && c[r.ereignis] !== undefined) c[r.ereignis]++; });
  anfr.forEach(r => per[r.kanal].anfragen++);
  const tot = { besuch: 0, finder_start: 0, anfragen: 0 };
  Object.values(per).forEach(c => { tot.besuch += c.besuch; tot.finder_start += c.finder_start; tot.anfragen += c.anfragen; });

  const praxis = { 'Zahnärzte': 0, 'Kieferorthopäden': 0, 'Sonstige': 0 };
  anfr.forEach(r => { const b = r.berufsgruppe; if (b in praxis) praxis[b]++; else praxis['Sonstige']++; });

  const prod = {};
  anfr.forEach(r => String(r.produkte || '').split(/\n|,/).forEach(p => {
    const n = p.trim().replace(/\s*\[[^\]]+\]/g, '').replace(/\s*×\s*\d+/g, '').replace(/\s*\((Paket|Extra)\)\s*$/i, '').trim();
    if (n && n !== 'Produktanfrage') prod[n] = (prod[n] || 0) + 1;
  }));
  const topProd = Object.entries(prod).sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0])).slice(0, 8);

  // Zeitreihe: Tage, ab > 62 Tagen Wochen (Montag)
  const days = Math.round((STATE.bis - STATE.von) / 864e5) + 1;
  const weekly = days > 62;
  const bucketKey = iso => { const d = new Date(iso); d.setHours(0,0,0,0); if (weekly) { const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); } return ymd(d); };
  const buckets = [];
  const cur = new Date(STATE.von);
  if (weekly) cur.setDate(cur.getDate() - ((cur.getDay() + 6) % 7));
  while (cur <= STATE.bis) { buckets.push(ymd(cur)); cur.setDate(cur.getDate() + (weekly ? 7 : 1)); }
  const series = { besuch: Object.fromEntries(buckets.map(b => [b, 0])), anfragen: Object.fromEntries(buckets.map(b => [b, 0])) };
  STATE.visits.forEach(r => { if (r.ereignis === 'besuch') { const b = bucketKey(r.created_at); if (b in series.besuch) series.besuch[b]++; } });
  anfr.forEach(r => { const b = bucketKey(r.created_at); if (b in series.anfragen) series.anfragen[b]++; });

  STATE.agg = { per, tot, praxis, topProd, buckets, series, weekly, anfrCount: anfr.length };
}

function kanalLabel(id) { return KANAELE.find(k => k.id === id).label; }
// Kanal im Satz (mit Artikel): „Reichweitenstärkster Kanal war der Newsletter …“
const KANAL_SATZ = { instagram: 'Instagram', newsletter: 'der Newsletter', direkt: 'der Direktaufruf (Link ohne Kanal-Kennung)', sonstige: 'die Gruppe sonstiger Kanäle' };

function buildSummary() {
  const { per, tot, praxis, topProd } = STATE.agg;
  const k = KAMPAGNEN[STATE.kampagne];
  const zr = `${dDE(STATE.von)} bis ${dDE(STATE.bis)}`;
  const parts = [];
  if (tot.besuch > 0) {
    parts.push(`Im Zeitraum ${zr} wurde die Landingpage „${k.titel}“ ${nf(tot.besuch)}-mal besucht. ${nf(tot.finder_start)} Besucher (${pct(tot.finder_start, tot.besuch)}) haben den Praxis-Check gestartet, ${nf(tot.anfragen)} ${tot.anfragen === 1 ? 'hat' : 'haben'} eine konkrete Anfrage gestellt – eine Conversion von ${pct(tot.anfragen, tot.besuch)}.`);
  } else {
    parts.push(`Im Zeitraum ${zr} gingen über die Landingpage „${k.titel}“ ${nf(tot.anfragen)} ${tot.anfragen === 1 ? 'Anfrage' : 'Anfragen'} ein.`);
  }
  const aktive = KANAL_IDS.filter(id => per[id].besuch > 0 || per[id].anfragen > 0);
  if (aktive.length) {
    const byVisits = [...aktive].sort((x, y) => per[y].besuch - per[x].besuch || per[y].anfragen - per[x].anfragen);
    const top = byVisits[0];
    let s = `Reichweitenstärkster Kanal war ${KANAL_SATZ[top]} mit ${nf(per[top].besuch)} Besuchen und ${nf(per[top].anfragen)} ${per[top].anfragen === 1 ? 'Anfrage' : 'Anfragen'}.`;
    const conv = aktive.filter(id => per[id].besuch >= 10).sort((x, y) => per[y].anfragen / per[y].besuch - per[x].anfragen / per[x].besuch);
    if (conv.length > 1 && conv[0] !== top && per[conv[0]].anfragen > 0) s += ` Die höchste Conversion erzielte ${KANAL_SATZ[conv[0]]} mit ${pct(per[conv[0]].anfragen, per[conv[0]].besuch)}.`;
    parts.push(s);
  }
  if (tot.anfragen > 0) {
    const za = praxis['Zahnärzte'], kfo = praxis['Kieferorthopäden'];
    parts.push(`${nf(za)} ${za === 1 ? 'Anfrage kam' : 'Anfragen kamen'} aus Zahnarztpraxen, ${nf(kfo)} aus der Kieferorthopädie.`);
    if (topProd.length) parts.push(`Am häufigsten nachgefragt: ${topProd.slice(0, 3).map(([n]) => n).join(', ')}.`);
  }
  return parts.join(' ');
}

function render() {
  const { per, tot, praxis, topProd, buckets, series, weekly } = STATE.agg;
  const k = KAMPAGNEN[STATE.kampagne];
  const prevText = document.getElementById('summary-ta')?.value;
  const summary = STATE.summaryEdited && prevText != null ? prevText : buildSummary();
  const maxBesuch = Math.max(1, ...KANAL_IDS.map(id => per[id].besuch));
  const rows = KANAELE.filter(c => c.id !== 'sonstige' || per.sonstige.besuch || per.sonstige.anfragen);

  const kanalRows = rows.map(c => { const r = per[c.id]; return `
    <tr>
      <td><span class="sw" style="background:${c.color}"></span>${esc(c.label)}</td>
      <td class="bar-cell"><div class="dbar" data-tip="<b>${esc(c.label)}</b> · ${nf(r.besuch)} Besuche (${pct(r.besuch, tot.besuch)} aller Besuche)"><i style="width:${r.besuch / maxBesuch * 100}%;background:${c.color}"></i></div></td>
      <td>${nf(r.besuch)}</td><td>${nf(r.finder_start)}</td><td>${nf(r.anfragen)}</td><td>${pct(r.anfragen, r.besuch)}</td>
    </tr>`; }).join('');

  const praxisTot = Object.values(praxis).reduce((a, b) => a + b, 0);
  const praxisDef = [['Zahnärzte', 'Zahnarztpraxen', 'var(--k-newsletter)'], ['Kieferorthopäden', 'Kieferorthopädie', 'var(--k-instagram)'], ['Sonstige', 'Sonstige', 'var(--k-sonstige)']]
    .filter(([key]) => key !== 'Sonstige' || praxis.Sonstige);
  const maxProd = Math.max(1, ...topProd.map(p => p[1]));

  document.getElementById('report').innerHTML = `
  <article class="sheet" id="sheet">
    <header class="sheet-head">
      <div>
        <div class="eyebrow">Kampagnen-Report</div>
        <h2>${esc(k.titel)}</h2>
        <p>${dDE(STATE.von)} – ${dDE(STATE.bis)} · ${esc(k.seite)}</p>
      </div>
      <div class="sheet-brand"><span class="ivoris-word">ivoris<sup>®</sup></span><span class="x">×</span><img src="../logos/ehs-logo-on-dark.png" alt="eHealth Sales"></div>
    </header>
    <div class="sheet-body">
      <section class="card summary">
        <h3>Management Summary</h3>
        <textarea id="summary-ta" aria-label="Management Summary">${esc(summary)}</textarea>
        <div class="print-text" id="summary-print"></div>
        <div class="summary-actions"><span>Text frei anpassbar – wird so ins PDF übernommen.</span><button class="link-btn" onclick="regenSummary()">Neu aus Zahlen erzeugen</button></div>
      </section>

      <section class="kpis">
        <div class="kpi"><div class="lbl">Besuche</div><div class="val">${nf(tot.besuch)}</div><div class="hint">einmal pro Sitzung gezählt</div></div>
        <div class="kpi"><div class="lbl">Check gestartet</div><div class="val">${nf(tot.finder_start)}</div><div class="hint">${pct(tot.finder_start, tot.besuch)} der Besuche</div></div>
        <div class="kpi"><div class="lbl">Anfragen</div><div class="val">${nf(tot.anfragen)}</div><div class="hint">über den Produktfinder</div></div>
        <div class="kpi"><div class="lbl">Conversion</div><div class="val">${pct(tot.anfragen, tot.besuch)}</div><div class="hint">Anfragen je Besuch</div></div>
      </section>

      <section class="card">
        <h3>Ergebnis nach Kanal</h3>
        <div class="sub">Besuch → Praxis-Check gestartet → Anfrage</div>
        <div class="table-wrap"><table class="kanal">
          <thead><tr><th>Kanal</th><th class="bar-cell"></th><th>Besuche</th><th>Check gestartet</th><th>Anfragen</th><th>Conversion</th></tr></thead>
          <tbody>${kanalRows}</tbody>
          <tfoot><tr><td>Gesamt</td><td class="bar-cell"></td><td>${nf(tot.besuch)}</td><td>${nf(tot.finder_start)}</td><td>${nf(tot.anfragen)}</td><td>${pct(tot.anfragen, tot.besuch)}</td></tr></tfoot>
        </table></div>
      </section>

      <div class="grid-2">
        <section class="card">
          <h3>Anfragen nach Praxistyp</h3>
          <div class="sub">${nf(praxisTot)} ${praxisTot === 1 ? 'Anfrage' : 'Anfragen'}</div>
          ${praxisTot ? `<div class="split">${praxisDef.filter(([key]) => praxis[key]).map(([key, lbl, col]) =>
              `<i style="flex:${praxis[key]};background:${col}" data-tip="<b>${lbl}</b> · ${nf(praxis[key])} (${pct(praxis[key], praxisTot)})"></i>`).join('')}</div>
            <div class="legend">${praxisDef.map(([key, lbl, col]) => `<span><span class="sw" style="background:${col}"></span>${lbl} <b>${nf(praxis[key])}</b> · ${pct(praxis[key], praxisTot)}</span>`).join('')}</div>`
            : '<div class="empty">Noch keine Anfragen im Zeitraum.</div>'}
        </section>
        <section class="card">
          <h3>Gefragte Lösungen</h3>
          <div class="sub">Nennungen in Anfragen (Top ${topProd.length || 8})</div>
          ${topProd.length ? `<div class="hbars">${topProd.map(([n, c]) =>
              `<div class="hb"><span title="${esc(n)}">${esc(n)}</span><div class="track" data-tip="<b>${esc(n)}</b> · ${nf(c)} ${c === 1 ? 'Nennung' : 'Nennungen'}"><i style="width:${c / maxProd * 100}%"></i></div><b>${nf(c)}</b></div>`).join('')}</div>`
            : '<div class="empty">Noch keine Produktnennungen im Zeitraum.</div>'}
        </section>
      </div>

      <section class="card">
        <h3>Verlauf</h3>
        <div class="sub">pro ${weekly ? 'Woche' : 'Tag'} – zwei Diagramme mit eigener Skala</div>
        <div class="trend">
          ${trendChart('Besuche', buckets, series.besuch, 'var(--k-newsletter)', weekly)}
          ${trendChart('Anfragen', buckets, series.anfragen, 'var(--k-instagram)', weekly)}
        </div>
      </section>

      <p class="note">Datenbasis: Besuche werden anonym und ohne Cookies einmal pro Browser-Sitzung gezählt (Zählung seit ${dDE(parseYmd(k.start))}); der Kanal ergibt sich aus dem Link-Parameter utm_source (z. B. Instagram, Newsletter). Anfragen stammen aus dem eHealth-Sales-Produktfinder auf der Landingpage. Der Report enthält keine personenbezogenen Daten.</p>
    </div>
    <footer class="sheet-foot"><span>eHealth Sales GmbH · Zur Zaubernuß 13 · 49124 Georgsmarienhütte</span><span>Erstellt am ${dDE(new Date())}</span></footer>
  </article>`;

  const ta = document.getElementById('summary-ta');
  const fit = () => { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 4) + 'px'; };
  ta.addEventListener('input', () => { STATE.summaryEdited = true; fit(); });
  fit();
  bindTips();
}

function trendChart(title, buckets, data, color, weekly) {
  const vals = buckets.map(b => data[b] || 0);
  const sum = vals.reduce((a, b) => a + b, 0);
  const max = Math.max(1, ...vals);
  const W = 900, H = 90, padB = 16, n = vals.length;
  const slot = W / n, bw = Math.max(2, Math.min(28, slot - 2));
  const label = b => { const d = parseYmd(b); return (weekly ? 'KW ab ' : '') + d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }); };
  const step = Math.ceil(n / 8);
  const bars = vals.map((v, i) => {
    const h = v ? Math.max(2, (v / max) * (H - padB - 6)) : 0;
    const x = i * slot + (slot - bw) / 2, y = H - padB - h;
    const r = Math.min(4, bw / 2, h);
    const path = h ? `M${x},${H - padB} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${H - padB} Z` : '';
    return `<g data-tip="<b>${label(buckets[i])}</b> · ${nf(v)} ${esc(title)}"><rect x="${i * slot}" y="0" width="${slot}" height="${H - padB}" fill="transparent"/>${path ? `<path d="${path}" fill="${color}"/>` : ''}</g>`;
  }).join('');
  const ticks = vals.map((_, i) => i % step === 0 ? `<text class="axis" x="${i * slot + slot / 2}" y="${H - 3}" text-anchor="middle">${label(buckets[i]).replace('KW ab ', '')}</text>` : '').join('');
  return `<div><div class="trend-title">${esc(title)} <span>Summe ${nf(sum)} · max. ${nf(max)} pro ${weekly ? 'Woche' : 'Tag'}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(title)} pro ${weekly ? 'Woche' : 'Tag'}, Summe ${sum}">
      <line x1="0" y1="${H - padB}" x2="${W}" y2="${H - padB}" stroke="#CBD2DC" stroke-width="1"/>${bars}${ticks}</svg></div>`;
}

function bindTips() {
  const tip = document.getElementById('tip');
  document.querySelectorAll('#report [data-tip]').forEach(el => {
    el.addEventListener('mousemove', e => {
      tip.innerHTML = el.getAttribute('data-tip'); tip.style.opacity = 1;
      const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
      tip.style.left = x + 'px'; tip.style.top = (e.clientY - tip.offsetHeight - 10) + 'px';
    });
    el.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
  });
}

function regenSummary() { STATE.summaryEdited = false; const ta = document.getElementById('summary-ta'); ta.value = buildSummary(); ta.dispatchEvent(new Event('input')); STATE.summaryEdited = false; }

function printReport() {
  document.getElementById('summary-print').textContent = document.getElementById('summary-ta').value;
  const old = document.title;
  document.title = `Kampagnen-Report ${KAMPAGNEN[STATE.kampagne].label.replace('®', '')} ${ymd(STATE.von)} bis ${ymd(STATE.bis)}`;
  window.print();
  setTimeout(() => { document.title = old; }, 500);
}

function exportCsv() {
  const { per, tot } = STATE.agg;
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [['Kanal', 'Besuche', 'Check gestartet', 'Anfragen', 'Conversion'].map(q).join(';')];
  KANAELE.forEach(c => { const r = per[c.id]; lines.push([c.label, r.besuch, r.finder_start, r.anfragen, pct(r.anfragen, r.besuch)].map(q).join(';')); });
  lines.push(['Gesamt', tot.besuch, tot.finder_start, tot.anfragen, pct(tot.anfragen, tot.besuch)].map(q).join(';'));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kampagnen-report-${STATE.kampagne}-${ymd(STATE.von)}-${ymd(STATE.bis)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

init();
</script>
