<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alliance Portal – Regulatorik</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="perm.js"></script>
<script src="nav.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #3C4A7C; --green: #6DC52D; --navy-dark: #2d3a63;
    --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
    --gray-400: #94a3b8; --gray-500: #64748b; --gray-700: #334155; --gray-900: #0f172a;
    --red: #ef4444; --orange: #f59e0b; --blue: #3b82f6; --teal: #0d9488;
  }
  body { font-family: 'Inter','Helvetica Neue',sans-serif; background: var(--gray-50); color: var(--gray-900); }

  /* ── Topbar ── */
  .topbar { background: var(--navy); color: white; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
  .topbar-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1rem; }
  .topbar-brand img { height: 32px; border-radius: 6px; }
  .topbar-brand span { opacity: 0.7; font-weight: 400; font-size: 0.78rem; margin-left: 4px; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .user-chip { background: rgba(255,255,255,0.12); border-radius: 20px; padding: 5px 12px; font-size: 0.78rem; }
  .role-badge { font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: rgba(109,197,45,0.2); color: #a7f3d0; letter-spacing: 0.04em; }
  .btn-logout { background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 8px; padding: 7px 14px; font-size: 0.78rem; cursor: pointer; }
  .btn-logout:hover { background: rgba(255,255,255,0.2); }

  /* ── Layout ── */
  .layout { display: flex; min-height: calc(100vh - 60px); }
  .sidebar { width: 220px; flex-shrink: 0; background: white; border-right: 1px solid var(--gray-200); padding: 24px 12px; }
  .nav-section { font-size: 0.62rem; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.1em; padding: 0 10px; margin-bottom: 6px; margin-top: 20px; }
  .nav-section:first-child { margin-top: 0; }
  .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: var(--gray-500); font-size: 0.85rem; font-weight: 500; text-decoration: none; transition: all 0.15s; }
  .nav-link:hover { background: var(--gray-100); color: var(--navy); }
  .nav-link.active { background: #eef0f7; color: var(--navy); font-weight: 700; }
  .nav-group-header { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: var(--gray-500); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.15s; user-select: none; }
  .nav-group-header:hover { background: var(--gray-100); color: var(--navy); }
  .nav-group-header > svg:first-child { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-group-header > span { flex: 1; }
  .nav-chevron { width: 14px; height: 14px; flex-shrink: 0; transition: transform 0.2s; }
  .nav-group.open .nav-chevron { transform: rotate(90deg); }
  .nav-group-body { display: none; }
  .nav-group.open .nav-group-body { display: block; }
  .nav-sub { padding-left: 28px !important; }
  .nav-subgroup { margin-top: 2px; }
  .nav-subgroup-label { font-size: 0.62rem; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.1em; padding: 6px 10px 4px 28px; }
  .nav-sub2 { padding-left: 40px !important; }
  .nav-link svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ── Main ── */
  .main { flex: 1; padding: 32px 36px; min-width: 0; }
  h1 { font-family: Montserrat, sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--navy); }
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .page-subtitle { color: var(--gray-500); font-size: 0.875rem; margin-top: 4px; }

  /* ── Buttons ── */
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 9px; font-size: 0.85rem; font-weight: 600; border: none; cursor: pointer; transition: all 0.15s; font-family: inherit; }
  .btn-primary { background: var(--navy); color: white; }
  .btn-primary:hover { background: var(--navy-dark); }
  .btn-secondary { background: var(--gray-100); color: var(--gray-700); }
  .btn-secondary:hover { background: var(--gray-200); }
  .btn-danger { background: #fef2f2; color: var(--red); }
  .btn-danger:hover { background: #fee2e2; }
  .btn-sm { padding: 5px 11px; font-size: 0.78rem; }

  /* ── Law tabs ── */
  .law-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .law-tab { padding: 7px 16px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; border: 1.5px solid var(--gray-200); background: white; color: var(--gray-500); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
  .law-tab:hover { border-color: var(--navy); color: var(--navy); }
  .law-tab.active { background: var(--navy); color: white; border-color: var(--navy); }
  .law-tab-count { font-size: 0.7rem; background: rgba(255,255,255,0.25); border-radius: 10px; padding: 1px 6px; }
  .law-tab.active .law-tab-count { background: rgba(255,255,255,0.25); }
  .law-tab:not(.active) .law-tab-count { background: var(--gray-200); color: var(--gray-500); }

  /* ── Search bar ── */
  .search-row { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); pointer-events: none; }
  .search-wrap input { width: 100%; padding: 9px 14px 9px 36px; border: 1.5px solid var(--gray-200); border-radius: 9px; font-size: 0.875rem; outline: none; font-family: inherit; background: white; }
  .search-wrap input:focus { border-color: var(--navy); }

  /* ── Status badges ── */
  .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em; }
  .status-kraft     { background: #dcfce7; color: #166534; }
  .status-kabinett  { background: #dbeafe; color: #1e40af; }
  .status-parlament { background: #fef3c7; color: #92400e; }
  .status-referent  { background: var(--gray-200); color: var(--gray-700); }
  .status-vorbereitung { background: #f3e8ff; color: #6b21a8; }
  .status-aufgehoben { background: #fef2f2; color: #991b1b; }

  /* ── Category badges ── */
  .cat-badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; background: var(--gray-100); color: var(--gray-500); }
  .cat-überblick    { background: #f0fdf4; color: #166534; }
  .cat-epa          { background: #eff6ff; color: #1d4ed8; }
  .cat-datenzugang  { background: #f5f3ff; color: #5b21b6; }
  .cat-interoperabilität { background: #fff7ed; color: #c2410c; }
  .cat-ti           { background: #ecfeff; color: #0e7490; }
  .cat-diga         { background: #fdf4ff; color: #7e22ce; }
  .cat-datenschutz  { background: #fff1f2; color: #be123c; }
  .cat-cybersecurity { background: #fef2ff; color: #86198f; }
  .cat-telemedizin   { background: #f0fdf9; color: #0f766e; }
  .cat-pflege        { background: #fff7ed; color: #c2410c; }

  /* ── Main content layout ── */
  .content-layout { display: grid; grid-template-columns: 180px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 800px) { .content-layout { grid-template-columns: 1fr; } }

  /* ── Cat sidebar ── */
  .cat-sidebar { position: sticky; top: 80px; background: white; border-radius: 12px; border: 1px solid var(--gray-200); padding: 10px 8px; }
  .cat-item { padding: 7px 10px; border-radius: 8px; font-size: 0.82rem; font-weight: 500; cursor: pointer; color: var(--gray-500); transition: all 0.15s; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .cat-item:hover { background: var(--gray-100); color: var(--navy); }
  .cat-item.active { background: #eef0f7; color: var(--navy); font-weight: 700; }
  .cat-count { font-size: 0.7rem; background: var(--gray-100); color: var(--gray-400); border-radius: 8px; padding: 1px 6px; min-width: 20px; text-align: center; }
  .cat-item.active .cat-count { background: rgba(60,74,124,0.12); color: var(--navy); }

  /* ── Article list ── */
  .article-row { background: white; border-radius: 11px; border: 1px solid var(--gray-200); padding: 14px 18px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s; }
  .article-row:last-child { margin-bottom: 0; }
  .article-row:hover { border-color: var(--navy); box-shadow: 0 2px 10px rgba(60,74,124,0.08); }
  .article-row.selected { border-color: var(--navy); background: #f8f9fc; }
  .article-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .article-para { font-size: 0.72rem; font-weight: 700; color: var(--gray-400); font-variant-numeric: tabular-nums; }
  .article-title { font-size: 0.95rem; font-weight: 700; color: var(--gray-900); margin-bottom: 5px; }
  .article-excerpt { font-size: 0.82rem; color: var(--gray-500); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .tag { background: var(--gray-100); color: var(--gray-500); padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 500; }

  /* ── Detail panel ── */
  .detail-overlay { display: none; position: fixed; inset: 60px 0 0 0; z-index: 50; }
  .detail-overlay.open { display: flex; }
  .detail-backdrop { flex: 1; background: rgba(15,23,42,0.3); cursor: pointer; }
  .detail-panel { width: 560px; max-width: 100vw; background: white; border-left: 1px solid var(--gray-200); display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,0.12); overflow-y: auto; }
  @media (max-width: 640px) { .detail-panel { width: 100vw; border-left: none; } }
  .detail-header { padding: 24px 24px 16px; border-bottom: 1px solid var(--gray-200); position: sticky; top: 0; background: white; z-index: 2; }
  .detail-close { position: absolute; right: 18px; top: 18px; background: var(--gray-100); border: none; border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gray-500); }
  .detail-close:hover { background: var(--gray-200); }
  .detail-law-name { font-size: 0.72rem; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .detail-title { font-family: Montserrat, sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--navy); line-height: 1.35; margin-bottom: 10px; }
  .detail-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .detail-body { padding: 20px 24px; flex: 1; }
  .detail-content { font-size: 0.875rem; color: var(--gray-900); line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
  .detail-relevance { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 14px 16px; margin-top: 18px; }
  .detail-relevance-label { font-size: 0.7rem; font-weight: 700; color: #1d4ed8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .detail-relevance-text { font-size: 0.85rem; color: var(--gray-700); line-height: 1.6; }
  .detail-footer { padding: 14px 24px; border-top: 1px solid var(--gray-200); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .detail-source { font-size: 0.78rem; color: var(--navy); font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail-source:hover { text-decoration: underline; }
  .detail-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 12px; }

  /* ── Empty / loading ── */
  .empty { text-align: center; padding: 48px 24px; color: var(--gray-400); }
  .empty svg { width: 48px; height: 48px; margin: 0 auto 12px; display: block; opacity: 0.4; }
  .loading { text-align: center; padding: 40px; color: var(--gray-400); font-size: 0.875rem; }

  /* ── Modal (Add/Edit) ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 16px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.2); }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-family: Montserrat, sans-serif; font-size: 1.05rem; font-weight: 800; color: var(--navy); }
  .modal-close { background: var(--gray-100); border: none; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--gray-500); }
  .modal-close:hover { background: var(--gray-200); }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 14px 24px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 10px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--gray-700); margin-bottom: 5px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 8px 12px; border: 1.5px solid var(--gray-200); border-radius: 9px;
    font-size: 0.875rem; font-family: inherit; outline: none; background: white; color: var(--gray-900);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--navy); }
  .form-group textarea { resize: vertical; min-height: 100px; }
  .msg { font-size: 0.8rem; padding: 7px 12px; border-radius: 7px; margin-top: 8px; display: none; }
  .msg.ok  { background: #f0fdf4; color: #166534; display: block; }
  .msg.err { background: #fef2f2; color: #991b1b; display: block; }

  /* ── Warn badge for "umstritten" ── */
  .warn-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; background: #fff7ed; color: #c2410c; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800&display=swap">
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <img src="../alliance-logo.png" alt="Alliance" onerror="this.style.display='none'">
    Alliance Portal
    <span>/ Regulatorik</span>
  </div>
  <div class="topbar-right">
    <span class="user-chip" id="user-name">–</span>
    <span id="header-role-badge" class="role-badge" style="display:none"></span>
    <button class="btn-logout" onclick="logout()">Abmelden</button>
  </div>
</div>

<div class="layout">
  <nav class="sidebar" id="portal-nav"></nav>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Regulatorik &amp; Gesetze</h1>
        <p class="page-subtitle">Übersicht relevanter Gesetze und Paragraphen für das eHealth-Ökosystem</p>
      </div>
      <button class="btn btn-primary" id="btn-add" style="display:none" onclick="openModal()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="width:15px;height:15px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Eintrag hinzufügen
      </button>
    </div>

    <!-- Law tabs -->
    <div class="law-tabs" id="law-tabs"></div>

    <!-- Search -->
    <div class="search-row">
      <div class="search-wrap">
        <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="search-input" placeholder="Paragraphen, Stichwörter …" oninput="applyFilters()">
      </div>
    </div>

    <!-- Content grid -->
    <div class="content-layout">
      <div class="cat-sidebar" id="cat-sidebar"></div>
      <div id="article-list"></div>
    </div>
  </main>
</div>

<!-- Detail panel -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-backdrop" onclick="closeDetail()"></div>
  <div class="detail-panel" id="detail-panel">
    <div class="detail-header">
      <button class="detail-close" onclick="closeDetail()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <div class="detail-law-name" id="d-law-name"></div>
      <div class="detail-title" id="d-title"></div>
      <div class="detail-badges" id="d-badges"></div>
    </div>
    <div class="detail-body">
      <div class="detail-content" id="d-content"></div>
      <div class="detail-relevance" id="d-relevance" style="display:none">
        <div class="detail-relevance-label">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:13px;height:13px"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Relevanz für eHealth Alliance
        </div>
        <div class="detail-relevance-text" id="d-relevance-text"></div>
      </div>
      <div class="detail-tags" id="d-tags"></div>
      <div id="d-admin-actions" style="display:none; margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;"></div>
    </div>
    <div class="detail-footer" id="d-footer"></div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Eintrag hinzufügen</span>
      <button class="modal-close" onclick="closeModal()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Abkürzung (z. B. GeDiG) *</label>
          <input id="f-abbr" placeholder="GeDiG" maxlength="30">
        </div>
        <div class="form-group">
          <label>Status *</label>
          <select id="f-status">
            <option value="in Kraft">in Kraft</option>
            <option value="Kabinettsbeschluss">Kabinettsbeschluss</option>
            <option value="parlamentarische Beratung" selected>parlamentarische Beratung</option>
            <option value="Referentenentwurf">Referentenentwurf</option>
            <option value="in Vorbereitung">in Vorbereitung</option>
            <option value="aufgehoben">aufgehoben</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Vollständiger Gesetzesname *</label>
        <input id="f-name" placeholder="Gesetz für Daten und digitale Innovation im Gesundheitswesen">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Paragraph / Abschnitt</label>
          <input id="f-para" placeholder="§ 25b SGB V (optional)">
        </div>
        <div class="form-group">
          <label>Kategorie *</label>
          <select id="f-category">
            <option value="Überblick">Überblick</option>
            <option value="ePA">ePA</option>
            <option value="Datenzugang">Datenzugang</option>
            <option value="Interoperabilität">Interoperabilität</option>
            <option value="TI">TI</option>
            <option value="DiGA">DiGA</option>
            <option value="Datenschutz">Datenschutz</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Telemedizin">Telemedizin</option>
            <option value="Pflege">Pflege</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Titel des Eintrags *</label>
        <input id="f-title" placeholder="Kurzer beschreibender Titel">
      </div>
      <div class="form-group">
        <label>Inhalt / Gesetzestext *</label>
        <textarea id="f-content" style="min-height:140px" placeholder="Vollständiger Inhalt des Paragraphen oder der Regelung …"></textarea>
      </div>
      <div class="form-group">
        <label>Relevanz für eHealth Alliance</label>
        <textarea id="f-relevance" style="min-height:70px" placeholder="Warum ist dieser Paragraph für die Alliance relevant?"></textarea>
      </div>
      <div class="form-group">
        <label>Quelle (URL)</label>
        <input id="f-url" type="url" placeholder="https://…">
      </div>
      <div class="form-group">
        <label>Tags (kommagetrennt)</label>
        <input id="f-tags" placeholder="GeDiG, ePA, SGB V">
      </div>
      <div id="modal-msg" class="msg"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" id="btn-save" onclick="saveEntry()">Speichern</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL  = 'https://focysklymhmcfwgxdtuk.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvY3lza2x5bWhtY2Z3Z3hkdHVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NTY1NTUsImV4cCI6MjEwMzEzMjU1NX0.VxgHwrnFUd-_7Q3pZx0L-7xY5roBZ__rUnLc5W7lOgg';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { flowType: 'implicit' } });

  let allEntries = [];
  let filteredEntries = [];
  let currentLaw  = 'all';
  let currentCat  = 'all';
  let currentEntry = null;
  let editingId    = null;
  let userRole = 'partner';
  let userTier = null;

  const CATEGORIES = ['Überblick','ePA','Datenzugang','Interoperabilität','TI','DiGA','Datenschutz','Cybersecurity','Telemedizin','Pflege'];
  const STATUS_MAP = {
    'in Kraft':               'status-kraft',
    'Kabinettsbeschluss':     'status-kabinett',
    'parlamentarische Beratung': 'status-parlament',
    'Referentenentwurf':      'status-referent',
    'in Vorbereitung':        'status-vorbereitung',
    'aufgehoben':             'status-aufgehoben',
  };
  const CAT_MAP = {
    'Überblick': 'cat-überblick', 'ePA': 'cat-epa', 'Datenzugang': 'cat-datenzugang',
    'Interoperabilität': 'cat-interoperabilität', 'TI': 'cat-ti',
    'DiGA': 'cat-diga', 'Datenschutz': 'cat-datenschutz',
    'Cybersecurity': 'cat-cybersecurity', 'Telemedizin': 'cat-telemedizin', 'Pflege': 'cat-pflege',
  };

  // ── Helpers ──────────────────────────────────────────────────────────
  function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function statusBadge(s) { return `<span class="status-badge ${STATUS_MAP[s]||'status-referent'}">${esc(s)}</span>`; }
  function catBadge(c)    { return `<span class="cat-badge ${CAT_MAP[c]||''}">${esc(c)}</span>`; }

  // ── Data ─────────────────────────────────────────────────────────────
  async function loadEntries() {
    document.getElementById('article-list').innerHTML = '<div class="loading">Lade Einträge …</div>';
    const { data, error } = await sb.from('recht_datenbank')
      .select('*')
      .order('law_abbr').order('category').order('paragraph_title');
    if (error) { document.getElementById('article-list').innerHTML = '<div class="empty">Fehler beim Laden.</div>'; return; }
    allEntries = data || [];
    buildLawTabs();
    applyFilters();
  }

  // ── Law tabs ─────────────────────────────────────────────────────────
  function buildLawTabs() {
    const laws = {};
    allEntries.forEach(e => {
      if (!laws[e.law_abbr]) laws[e.law_abbr] = { name: e.law_name, status: e.law_status, count: 0 };
      laws[e.law_abbr].count++;
    });
    let html = `<button class="law-tab ${currentLaw==='all'?'active':''}" onclick="setLaw('all')">
      Alle <span class="law-tab-count">${allEntries.length}</span>
    </button>`;
    Object.entries(laws).forEach(([abbr, info]) => {
      html += `<button class="law-tab ${currentLaw===abbr?'active':''}" onclick="setLaw('${esc(abbr)}')">
        ${esc(abbr)} ${statusBadge(info.status)} <span class="law-tab-count">${info.count}</span>
      </button>`;
    });
    document.getElementById('law-tabs').innerHTML = html;
  }

  function setLaw(law) {
    currentLaw = law; currentCat = 'all';
    buildLawTabs(); applyFilters();
  }

  // ── Category sidebar ─────────────────────────────────────────────────
  function buildCatSidebar(entries) {
    const counts = { all: entries.length };
    entries.forEach(e => { counts[e.category] = (counts[e.category] || 0) + 1; });
    let html = `<div class="cat-item ${currentCat==='all'?'active':''}" onclick="setCat('all')">
      Alle <span class="cat-count">${entries.length}</span>
    </div>`;
    CATEGORIES.forEach(c => {
      if (!counts[c]) return;
      html += `<div class="cat-item ${currentCat===c?'active':''}" onclick="setCat('${esc(c)}')">
        ${esc(c)} <span class="cat-count">${counts[c]}</span>
      </div>`;
    });
    document.getElementById('cat-sidebar').innerHTML = html;
  }

  function setCat(cat) { currentCat = cat; applyFilters(); }

  // ── Filters ──────────────────────────────────────────────────────────
  function applyFilters() {
    const q = (document.getElementById('search-input').value || '').toLowerCase();
    filteredEntries = allEntries.filter(e => {
      if (currentLaw !== 'all' && e.law_abbr !== currentLaw) return false;
      if (currentCat !== 'all' && e.category !== currentCat) return false;
      if (q) {
        const haystack = [e.paragraph_title, e.content, e.relevance_note, e.paragraph_id,
                          e.law_abbr, ...(e.tags||[])].join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });
    buildCatSidebar(currentLaw === 'all' ? allEntries : allEntries.filter(e => currentLaw === 'all' || e.law_abbr === currentLaw));
    renderList();
  }

  // ── List rendering ────────────────────────────────────────────────────
  function renderList() {
    const el = document.getElementById('article-list');
    if (!filteredEntries.length) {
      el.innerHTML = `<div class="empty">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Keine Einträge gefunden
      </div>`;
      return;
    }
    el.innerHTML = filteredEntries.map(e => {
      const isSelected = currentEntry && currentEntry.id === e.id;
      const excerpt = e.content.replace(/\n+/g, ' ').substring(0, 160) + '…';
      const isUmstritten = (e.tags||[]).includes('umstritten');
      return `<div class="article-row ${isSelected?'selected':''}" onclick="openDetail('${e.id}')">
        <div class="article-meta">
          ${e.paragraph_id ? `<span class="article-para">${esc(e.paragraph_id)}</span>` : ''}
          ${catBadge(e.category)}
          ${statusBadge(e.law_status)}
          ${isUmstritten ? '<span class="warn-chip">⚠ umstritten</span>' : ''}
        </div>
        <div class="article-title">${esc(e.paragraph_title)}</div>
        <div class="article-excerpt">${esc(excerpt)}</div>
        ${(e.tags||[]).length ? `<div class="article-tags">${e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      </div>`;
    }).join('');
  }

  // ── Detail panel ──────────────────────────────────────────────────────
  function openDetail(id) {
    const e = allEntries.find(x => x.id === id);
    if (!e) return;
    currentEntry = e;
    renderList(); // re-render to show selected state

    const isUmstritten = (e.tags||[]).includes('umstritten');
    document.getElementById('d-law-name').textContent = `${e.law_abbr} — ${e.law_name}`;
    document.getElementById('d-title').textContent = e.paragraph_id ? `${e.paragraph_id}  ${e.paragraph_title}` : e.paragraph_title;
    document.getElementById('d-badges').innerHTML = `
      ${catBadge(e.category)}
      ${statusBadge(e.law_status)}
      ${isUmstritten ? '<span class="warn-chip">⚠ umstritten</span>' : ''}
    `;
    document.getElementById('d-content').textContent = e.content;

    const relBox = document.getElementById('d-relevance');
    if (e.relevance_note) {
      document.getElementById('d-relevance-text').textContent = e.relevance_note;
      relBox.style.display = '';
    } else { relBox.style.display = 'none'; }

    document.getElementById('d-tags').innerHTML = (e.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');

    const footer = document.getElementById('d-footer');
    footer.innerHTML = e.source_url
      ? `<a class="detail-source" href="${esc(e.source_url)}" target="_blank" rel="noopener">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;flex-shrink:0"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          Originalquelle öffnen
        </a>`
      : '';

    if (userRole === 'admin') {
      footer.innerHTML += `
        <button class="btn btn-secondary btn-sm" onclick="startEdit('${e.id}')">Bearbeiten</button>
        <button class="btn btn-danger btn-sm" onclick="deleteEntry('${e.id}')">Löschen</button>
      `;
    }

    document.getElementById('detail-overlay').classList.add('open');
  }

  function closeDetail() {
    document.getElementById('detail-overlay').classList.remove('open');
    currentEntry = null;
    renderList();
  }

  // ── Modal ─────────────────────────────────────────────────────────────
  function openModal(entry = null) {
    editingId = entry ? entry.id : null;
    document.getElementById('modal-title').textContent = entry ? 'Eintrag bearbeiten' : 'Eintrag hinzufügen';
    document.getElementById('f-abbr').value     = entry?.law_abbr || '';
    document.getElementById('f-name').value     = entry?.law_name || '';
    document.getElementById('f-status').value   = entry?.law_status || 'parlamentarische Beratung';
    document.getElementById('f-para').value     = entry?.paragraph_id || '';
    document.getElementById('f-title').value    = entry?.paragraph_title || '';
    document.getElementById('f-category').value = entry?.category || 'Überblick';
    document.getElementById('f-content').value  = entry?.content || '';
    document.getElementById('f-relevance').value= entry?.relevance_note || '';
    document.getElementById('f-url').value      = entry?.source_url || '';
    document.getElementById('f-tags').value     = (entry?.tags||[]).join(', ');
    document.getElementById('modal-msg').className = 'msg';
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

  function startEdit(id) {
    const e = allEntries.find(x => x.id === id);
    if (e) openModal(e);
  }

  async function saveEntry() {
    const abbr   = document.getElementById('f-abbr').value.trim();
    const name   = document.getElementById('f-name').value.trim();
    const title  = document.getElementById('f-title').value.trim();
    const content= document.getElementById('f-content').value.trim();
    const cat    = document.getElementById('f-category').value;
    if (!abbr||!name||!title||!content) {
      showMsg('modal-msg','Pflichtfelder ausfüllen (*)','err'); return;
    }
    const tagsRaw = document.getElementById('f-tags').value;
    const tags = tagsRaw ? tagsRaw.split(',').map(t=>t.trim()).filter(Boolean) : [];
    const payload = {
      law_abbr: abbr, law_name: name,
      law_status: document.getElementById('f-status').value,
      paragraph_id: document.getElementById('f-para').value.trim() || null,
      paragraph_title: title,
      category: cat, content,
      relevance_note: document.getElementById('f-relevance').value.trim() || null,
      source_url: document.getElementById('f-url').value.trim() || null,
      tags,
    };
    document.getElementById('btn-save').textContent = 'Speichern …';
    let error;
    if (editingId) {
      ({ error } = await sb.from('recht_datenbank').update(payload).eq('id', editingId));
    } else {
      const { data: { session } } = await sb.auth.getSession();
      payload.created_by = session?.user?.id;
      ({ error } = await sb.from('recht_datenbank').insert(payload));
    }
    document.getElementById('btn-save').textContent = 'Speichern';
    if (error) { showMsg('modal-msg','Fehler: ' + error.message,'err'); return; }
    closeModal();
    await loadEntries();
  }

  async function deleteEntry(id) {
    if (!confirm('Eintrag wirklich löschen?')) return;
    const { error } = await sb.from('recht_datenbank').delete().eq('id', id);
    if (error) { alert('Fehler: ' + error.message); return; }
    closeDetail();
    await loadEntries();
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text; el.className = 'msg ' + type;
  }

  // ── Init ──────────────────────────────────────────────────────────────
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    _setHeaderUser(session.user.id);
    const { data: roleRow } = await sb.from('user_roles').select('role, partner_tier').eq('user_id', session.user.id).maybeSingle();
    userRole = roleRow?.role || 'partner';
    userTier = roleRow?.partner_tier || null;
    await window.initPerms(sb);
    enforcePage(userRole, userTier, 'regulatorik');
    if (userRole === 'admin') {
      document.getElementById('btn-add').style.display = '';
      document.getElementById('nav-group-admin').style.display = '';
    }
    await loadEntries();
  }

  async function _setHeaderUser(userId) {
    const [pr, rr] = await Promise.all([
      sb.from('user_profiles').select('vorname,nachname').eq('user_id', userId).maybeSingle(),
      sb.from('user_roles').select('role,partner_tier').eq('user_id', userId).maybeSingle(),
    ]);
    const p = pr.data;
    const name = p ? [p.vorname, p.nachname].filter(Boolean).join(' ') : null;
    const el = document.getElementById('user-name');
    if (el) el.textContent = name || 'Angemeldet';
    const r = rr.data;
    if (r?.role && r.role !== 'partner') {
      const badge = document.getElementById('header-role-badge');
      if (badge) { badge.textContent = r.role; badge.style.display = ''; }
    }
  }


  async function logout() { await sb.auth.signOut(); window.location.href = 'index.html'; }

  init();
</script>
</body>
</html>
