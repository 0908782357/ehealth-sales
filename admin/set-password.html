<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHS Portal – Passwort setzen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #3C4A7C; --green: #6DC52D; --navy-dark: #2d3a63;
    --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
    --gray-400: #94a3b8; --gray-500: #64748b; --gray-900: #0f172a;
    --red: #ef4444;
  }
  body {
    font-family: 'Inter', 'Helvetica Neue', sans-serif;
    background: var(--gray-50); color: var(--gray-900);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }

  .card {
    background: white; border-radius: 20px; width: 100%; max-width: 440px;
    padding: 40px 40px 36px; box-shadow: 0 8px 40px rgba(60,74,124,0.12);
    border: 1.5px solid var(--gray-200);
  }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .brand img { height: 36px; border-radius: 8px; }
  .brand-name { font-family: Montserrat, sans-serif; font-size: 1rem; font-weight: 800; color: var(--navy); }

  h1 { font-family: Montserrat, sans-serif; font-size: 1.35rem; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
  .subtitle { font-size: 0.85rem; color: var(--gray-400); margin-bottom: 28px; line-height: 1.5; }
  .email-tag {
    display: inline-block; background: #eef0f7; color: var(--navy);
    font-size: 0.78rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-bottom: 24px;
  }

  .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
  .form-group label { font-size: 0.72rem; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.06em; }
  .form-group input {
    border: 1.5px solid var(--gray-200); border-radius: 10px; padding: 11px 14px;
    font-size: 0.9rem; font-family: inherit; outline: none; transition: border 0.15s;
  }
  .form-group input:focus { border-color: var(--navy); }
  .hint { font-size: 0.72rem; color: var(--gray-400); margin-top: 3px; }

  .btn {
    width: 100%; padding: 12px; background: var(--navy); color: white;
    border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: background 0.15s; margin-top: 8px;
  }
  .btn:hover { background: var(--navy-dark); }
  .btn:disabled { opacity: 0.6; cursor: default; }

  .msg { display: none; padding: 10px 14px; border-radius: 9px; font-size: 0.82rem; margin-top: 14px; }
  .msg.error   { display: block; background: #fef2f2; color: var(--red); }
  .msg.success { display: block; background: #f0fdf4; color: #16a34a; }

  /* Loading state */
  .loading { text-align: center; color: var(--gray-400); font-size: 0.85rem; padding: 20px 0; }

  /* Password strength bar */
  .strength-bar { height: 4px; border-radius: 2px; background: var(--gray-200); margin-top: 6px; overflow: hidden; }
  .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <img src="../ehs-logo.jpg" alt="EHS" onerror="this.style.display='none'">
    <span class="brand-name">eHS Kunden Portal</span>
  </div>

  <div id="loading-state" class="loading">Zugang wird geprüft…</div>

  <div id="form-state" style="display:none">
    <h1>Passwort setzen</h1>
    <p class="subtitle">Wählen Sie ein sicheres Passwort für Ihren Portal-Zugang.</p>
    <div class="email-tag" id="email-tag">–</div>

    <div class="form-group">
      <label>Neues Passwort</label>
      <input type="password" id="f-pw" placeholder="Mindestens 8 Zeichen" autocomplete="new-password" oninput="checkStrength(this.value)">
      <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
      <span class="hint" id="strength-label"></span>
    </div>
    <div class="form-group">
      <label>Passwort bestätigen</label>
      <input type="password" id="f-pw-confirm" placeholder="Passwort wiederholen" autocomplete="new-password">
    </div>

    <button class="btn" id="submit-btn" onclick="savePassword()">Passwort setzen &amp; Portal öffnen</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
  const sb = supabase.createClient(
    'https://focysklymhmcfwgxdtuk.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvY3lza2x5bWhtY2Z3Z3hkdHVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NTY1NTUsImV4cCI6MjEwMzEzMjU1NX0.VxgHwrnFUd-_7Q3pZx0L-7xY5roBZ__rUnLc5W7lOgg',
    { auth: { flowType: 'implicit' } }
  );

  let currentUser = null;

  async function init() {
    // OTP magic link sets session via URL hash – wait briefly for SDK to process it
    await new Promise(r => setTimeout(r, 300));

    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }

    currentUser = session.user;

    // Bereits aktiv → direkt ins Dashboard
    const { data: profile } = await sb.from('user_profiles')
      .select('password_set')
      .eq('email', currentUser.email)
      .maybeSingle();

    if (profile?.password_set) {
      window.location.href = 'dashboard.html';
      return;
    }

    document.getElementById('email-tag').textContent = currentUser.email;
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('form-state').style.display = '';
    document.getElementById('f-pw').focus();
  }

  async function savePassword() {
    const pw  = document.getElementById('f-pw').value;
    const pwc = document.getElementById('f-pw-confirm').value;
    const btn = document.getElementById('submit-btn');

    if (pw.length < 8) { showMsg('Mindestens 8 Zeichen erforderlich.', 'error'); return; }
    if (pw !== pwc)    { showMsg('Passwörter stimmen nicht überein.', 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'Wird gespeichert…';

    const { error: pwErr } = await sb.auth.updateUser({ password: pw });
    if (pwErr) {
      showMsg('Fehler: ' + pwErr.message, 'error');
      btn.disabled = false; btn.textContent = 'Passwort setzen & Portal öffnen';
      return;
    }

    // Profil verknüpfen und als aktiv markieren
    await sb.from('user_profiles')
      .update({ user_id: currentUser.id, password_set: true })
      .eq('email', currentUser.email);

    showMsg('Passwort gesetzt! Sie werden weitergeleitet…', 'success');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
  }

  function checkStrength(pw) {
    const fill  = document.getElementById('strength-fill');
    const label = document.getElementById('strength-label');
    if (!pw) { fill.style.width = '0'; label.textContent = ''; return; }
    let score = 0;
    if (pw.length >= 8)  score++;
    if (pw.length >= 12) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    const map = [
      { w: '20%', bg: '#ef4444', t: 'Sehr schwach' },
      { w: '40%', bg: '#f97316', t: 'Schwach' },
      { w: '60%', bg: '#eab308', t: 'Mittel' },
      { w: '80%', bg: '#84cc16', t: 'Stark' },
      { w: '100%', bg: '#22c55e', t: 'Sehr stark' },
    ];
    const s = map[Math.min(score, 4)];
    fill.style.width = s.w; fill.style.background = s.bg;
    label.textContent = s.t; label.style.color = s.bg;
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text; el.className = 'msg ' + type;
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') savePassword();
  });

  init();
</script>
</body>
</html>
