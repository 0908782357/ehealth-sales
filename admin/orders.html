<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHS Portal – Bestellungen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #3C4A7C; --green: #6DC52D; --navy-dark: #2d3a63;
    --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
    --gray-400: #94a3b8; --gray-500: #64748b; --gray-900: #0f172a;
    --red: #ef4444; --amber: #f59e0b;
  }
  body { font-family: 'Inter','Helvetica Neue',sans-serif; background: var(--gray-50); color: var(--gray-900); }

  .topbar { background: var(--navy); color: white; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
  .topbar-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1rem; }
  .topbar-brand img { height: 32px; border-radius: 6px; }
  .topbar-brand span { opacity: 0.7; font-weight: 400; font-size: 0.78rem; margin-left: 4px; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .user-chip { background: rgba(255,255,255,0.12); border-radius: 20px; padding: 5px 12px; font-size: 0.78rem; }
  .btn-logout { background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 8px; padding: 7px 14px; font-size: 0.78rem; cursor: pointer; }
  .btn-logout:hover { background: rgba(255,255,255,0.2); }

  .layout { display: flex; min-height: calc(100vh - 60px); }
  .sidebar { width: 220px; flex-shrink: 0; background: white; border-right: 1px solid var(--gray-200); padding: 24px 12px; }
  .nav-section { font-size: 0.62rem; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.1em; padding: 0 10px; margin-bottom: 6px; margin-top: 20px; }
  .nav-section:first-child { margin-top: 0; }
  .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: var(--gray-500); font-size: 0.85rem; font-weight: 500; text-decoration: none; transition: all 0.15s; }
  .nav-link:hover { background: var(--gray-100); color: var(--navy); }
  .nav-link.active { background: #eef0f7; color: var(--navy); font-weight: 700; }
  .nav-link svg { width: 16px; height: 16px; flex-shrink: 0; }

  .main { flex: 1; padding: 32px 36px; overflow: auto; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  h1 { font-family: Montserrat, sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--navy); }
  .page-sub { color: var(--gray-400); font-size: 0.85rem; margin-bottom: 24px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; background: white; border: 1px solid var(--gray-200); border-radius: 12px; padding: 4px; margin-bottom: 20px; width: fit-content; }
  .tab-btn { padding: 7px 18px; border: none; border-radius: 9px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: transparent; color: var(--gray-500); transition: all 0.15s; }
  .tab-btn.active { background: var(--navy); color: white; }

  /* Table */
  .table-card { background: white; border-radius: 16px; border: 1px solid var(--gray-200); overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--gray-50); padding: 11px 16px; text-align: left; font-size: 0.72rem; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--gray-200); }
  td { padding: 14px 16px; border-bottom: 1px solid var(--gray-100); font-size: 0.875rem; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gray-50); }
  .empty { text-align: center; color: var(--gray-400); padding: 48px; font-size: 0.875rem; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; white-space: nowrap; }
  .badge-pending  { background: #fef3c7; color: #92400e; }
  .badge-approved { background: #d1fae5; color: #065f46; }
  .badge-rejected { background: var(--gray-100); color: var(--gray-400); }

  .btn { padding: 7px 14px; border-radius: 8px; border: none; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn-approve { background: #d1fae5; color: #065f46; }
  .btn-approve:hover { background: #a7f3d0; }
  .btn-reject  { background: var(--gray-100); color: var(--gray-500); }
  .btn-reject:hover  { background: var(--gray-200); }
  .btn-delete  { background: #fee2e2; color: #991b1b; margin-left: 6px; }
  .btn-delete:hover  { background: #fecaca; }

  /* Token-Popup */
  .token-box { background: #f0fdf4; border: 1.5px solid #bbf7d0; border-radius: 10px; padding: 14px 16px; margin-top: 8px; }
  .token-box p { font-size: 0.75rem; color: #065f46; margin-bottom: 8px; font-weight: 600; }
  .token-row { display: flex; align-items: center; gap: 8px; }
  .token-value { font-family: monospace; font-size: 0.78rem; background: white; border: 1px solid #bbf7d0; border-radius: 6px; padding: 7px 10px; flex: 1; word-break: break-all; color: #0f172a; }
  .btn-copy { background: #3C4A7C; color: white; padding: 7px 12px; font-size: 0.72rem; white-space: nowrap; }
  .btn-copy:hover { background: #2d3a63; }

  .order-name { font-weight: 600; }
  .order-email { font-size: 0.78rem; color: var(--gray-400); }
  .order-org   { font-size: 0.78rem; color: var(--gray-500); }
  .order-msg   { font-size: 0.78rem; color: var(--gray-500); font-style: italic; max-width: 260px; }
  .order-date  { font-size: 0.75rem; color: var(--gray-400); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <img src="../ehs-logo.jpg" alt="EHS" onerror="this.style.display='none'">
    eHS Partner Portal
    <span>/ Bestellungen</span>
  </div>
  <div class="topbar-right">
    <span class="user-chip" id="user-email">–</span>
    <button class="btn-logout" onclick="logout()">Abmelden</button>
  </div>
</div>

<div class="layout">
  <nav class="sidebar">
    <div class="nav-section">Navigation</div>
    <a class="nav-link" href="dashboard.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Dashboard
    </a>
    <a class="nav-link" id="nav-users" href="users.html" style="display:none">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      Nutzer
    </a>
    <a class="nav-link" id="nav-products" href="products.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      Produkte
    </a>
    <a class="nav-link" href="partners.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
      Partner
    </a>
    <a class="nav-link" href="finder-config.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
      Finder-Konfiguration
    </a>
    <a class="nav-link" href="shop.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
      Shop
    </a>
    <a class="nav-link active" id="nav-orders" href="orders.html" style="display:none">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
      Bestellungen
    </a>
    <a class="nav-link" href="knowledge.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      Community
    </a>
    <div class="nav-section">Account</div>
    <a class="nav-link" href="profile.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      Mein Konto
    </a>
    <a class="nav-link" href="../index.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Zur Website
    </a>
  </nav>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Bestellungen</h1>
      </div>
    </div>
    <p class="page-sub">Eingehende Bestellungen aus dem Shop – freischalten oder ablehnen.</p>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('pending')">Offen</button>
      <button class="tab-btn" onclick="showTab('approved')">Freigeschaltet</button>
      <button class="tab-btn" onclick="showTab('rejected')">Abgelehnt</button>
      <button class="tab-btn" onclick="showTab('all')">Alle</button>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Kunde</th>
            <th>Produkt</th>
            <th>Menge</th>
            <th>Datum</th>
            <th>Status</th>
            <th>Aktionen</th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
          <tr><td colspan="6" class="empty">Laden…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  const SUPABASE_URL  = 'https://focysklymhmcfwgxdtuk.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvY3lza2x5bWhtY2Z3Z3hkdHVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NTY1NTUsImV4cCI6MjEwMzEzMjU1NX0.VxgHwrnFUd-_7Q3pZx0L-7xY5roBZ__rUnLc5W7lOgg';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { flowType: 'implicit' } });

  let allOrders = [];
  let currentTab = 'pending';
  let generatedTokens = {}; // orderId → token string (just generated this session)
  let dbTokens = {};         // orderId → token string (loaded from DB)

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    document.getElementById('user-email').textContent = session.user.email;
    const { data: roleRow } = await sb.from('user_roles').select('role').eq('user_id', session.user.id).single();
    if (roleRow?.role !== 'admin') {
      document.querySelector('.main').innerHTML = '<p style="padding:40px;color:#94a3b8">Nur Admins können Bestellungen verwalten.</p>';
      return;
    }
    document.getElementById('nav-orders').style.display = '';
    document.getElementById('nav-users').style.display = '';
    await loadOrders();
  }

  async function loadOrders() {
    const { data, error } = await sb
      .from('orders')
      .select('*, shop_items(titel, requires_token, link_url)')
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }

    const userIds = [...new Set((data || []).map(o => o.user_id).filter(Boolean))];
    let profiles = {};
    if (userIds.length) {
      const { data: pd } = await sb
        .from('user_profiles')
        .select('user_id, vorname, nachname, email, firma')
        .in('user_id', userIds);
      (pd || []).forEach(p => { profiles[p.user_id] = p; });
    }

    allOrders = (data || []).map(o => ({ ...o, _profile: profiles[o.user_id] || null }));

    // Load existing tokens from DB for all orders
    const orderIds = allOrders.map(o => o.id);
    dbTokens = {};
    if (orderIds.length) {
      const { data: tokRows } = await sb
        .from('access_tokens')
        .select('order_id, token')
        .in('order_id', orderIds)
        .eq('valid', true);
      (tokRows || []).forEach(t => { dbTokens[t.order_id] = t.token; });
    }

    renderTable(currentTab);
  }

  function showTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', b.textContent.toLowerCase().includes(tab) || (tab === 'all' && b.textContent === 'Alle'));
    });
    renderTable(tab);
  }

  function renderTable(tab) {
    const filtered = tab === 'all' ? allOrders : allOrders.filter(o => o.status === tab);
    const tbody = document.getElementById('orders-tbody');
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">Keine Bestellungen.</td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map(o => {
      const date = new Date(o.created_at).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' });
      const statusBadge = {
        pending:  '<span class="badge badge-pending">Ausstehend</span>',
        approved: '<span class="badge badge-approved">Freigeschaltet</span>',
        rejected: '<span class="badge badge-rejected">Abgelehnt</span>'
      }[o.status] || '';

      const tokenVal = generatedTokens[o.id] || dbTokens[o.id] || null;
      const tokenSection = tokenVal
        ? `<div class="token-box">
            <p>Zugangscode:</p>
            <div class="token-row">
              <span class="token-value" id="tv-${o.id}">${tokenVal}</span>
              <button class="btn btn-copy" onclick="copyToken('${o.id}')">Kopieren</button>
            </div>
           </div>`
        : '';

      const requiresToken = !!o.shop_items?.requires_token;
      const actions = o.status === 'pending'
        ? `<button class="btn btn-approve" onclick="approveOrder('${o.id}','${o.shop_item_id}',${requiresToken})">
             ${requiresToken ? '🔑 Freischalten' : '✅ Bestätigen'}
           </button>
           <button class="btn btn-reject" onclick="rejectOrder('${o.id}')" style="margin-left:6px">Ablehnen</button>`
        : o.status === 'approved'
        ? `<button class="btn btn-reject" onclick="revokeOrder('${o.id}',${requiresToken})">Widerrufen</button>`
        : '';
      const deleteBtn = `<button class="btn btn-delete" onclick="deleteOrder('${o.id}')">Löschen</button>`;

      const p = o._profile;
      const fullName = p ? [p.vorname, p.nachname].filter(Boolean).join(' ') : '';
      const custEmail = o.email || p?.email || '–';
      const firma = p?.firma || '';

      return `<tr>
        <td>
          <div class="order-name">${fullName || custEmail}</div>
          ${fullName ? `<div class="order-email">${custEmail}</div>` : ''}
          ${firma ? `<div class="order-org">${firma}</div>` : ''}
        </td>
        <td>${o.shop_items?.titel || '–'}</td>
        <td><div class="order-msg">${o.quantity ? `Menge: ${o.quantity}` : '–'}</div></td>
        <td><div class="order-date">${date}</div></td>
        <td>${statusBadge}</td>
        <td>
          ${actions}
          ${deleteBtn}
          ${tokenSection}
        </td>
      </tr>`;
    }).join('');
  }

  const RESEND_API_KEY = 'HIER_RESEND_API_KEY_EINSETZEN';

  async function approveOrder(orderId, shopItemId, requiresToken) {
    const order = allOrders.find(o => o.id === orderId);
    const custEmail = order?.email || order?._profile?.email;
    const itemTitel = order?.shop_items?.titel || 'Ihr bestelltes Produkt';
    const linkUrl   = order?.shop_items?.link_url || '';

    let token = null;
    if (requiresToken) {
      const { data: tokenRow, error } = await sb
        .from('access_tokens')
        .insert({ order_id: orderId, shop_item_id: shopItemId || null })
        .select('token')
        .single();
      if (error) { alert('Fehler beim Generieren des Tokens: ' + error.message); return; }
      generatedTokens[orderId] = tokenRow.token;
      token = tokenRow.token;
    }

    await sb.from('orders').update({ status: 'approved' }).eq('id', orderId);

    if (custEmail) {
      await sendApprovalEmail(custEmail, itemTitel, token, linkUrl);
    }

    await loadOrders();
  }

  async function sendApprovalEmail(custEmail, itemTitel, token, linkUrl) {
    if (!RESEND_API_KEY || RESEND_API_KEY === 'HIER_RESEND_API_KEY_EINSETZEN') return;

    const tokenSection = token ? `
      <div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:10px;padding:16px 20px;margin:20px 0">
        <p style="margin:0 0 8px;font-size:0.85rem;font-weight:700;color:#065f46">Ihr Zugangscode:</p>
        <p style="margin:0;font-family:monospace;font-size:1.1rem;font-weight:800;color:#0f172a;letter-spacing:0.05em;word-break:break-all">${token}</p>
      </div>` : '';

    const linkSection = linkUrl ? `
      <div style="margin:20px 0">
        <a href="${linkUrl}" style="display:inline-block;background:#3C4A7C;color:white;padding:12px 24px;border-radius:9px;text-decoration:none;font-weight:700;font-size:0.9rem">Zum Produkt →</a>
      </div>` : '';

    const html = `<div style="font-family:Inter,sans-serif;max-width:600px;margin:0 auto">
      <div style="background:#3C4A7C;padding:24px 32px;border-radius:12px 12px 0 0">
        <h1 style="color:white;margin:0;font-size:1.1rem;font-weight:800">Ihre Bestellung wurde freigeschaltet</h1>
      </div>
      <div style="background:white;padding:24px 32px;border:1px solid #e2e8f0;border-top:none;border-radius:0 0 12px 12px">
        <p style="margin:0 0 12px;font-size:0.95rem">Gute Neuigkeit! Ihre Bestellung für <strong>${itemTitel}</strong> wurde freigeschaltet.</p>
        ${tokenSection}
        ${linkSection}
        <p style="margin:20px 0 0;font-size:0.82rem;color:#64748b">Bei Fragen stehen wir Ihnen unter <a href="mailto:info@ehealth-sales.de" style="color:#3C4A7C">info@ehealth-sales.de</a> zur Verfügung.</p>
      </div>
    </div>`;

    await fetch('https://api.resend.com/emails', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${RESEND_API_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from: 'noreply@ehealth-sales.de',
        to: [custEmail],
        subject: `Ihre Bestellung wurde freigeschaltet: ${itemTitel}`,
        html,
      }),
    }).catch(() => {});
  }

  async function rejectOrder(orderId) {
    if (!confirm('Bestellung wirklich ablehnen?')) return;
    await sb.from('orders').update({ status: 'rejected' }).eq('id', orderId);
    await loadOrders();
  }

  async function revokeOrder(orderId, requiresToken) {
    const msg = requiresToken ? 'Zugang widerrufen? Der Zugangscode wird ungültig.' : 'Bestellung zurücksetzen?';
    if (!confirm(msg)) return;
    if (requiresToken) {
      await sb.from('access_tokens').update({ valid: false }).eq('order_id', orderId);
    }
    await sb.from('orders').update({ status: 'rejected' }).eq('id', orderId);
    await loadOrders();
  }

  async function deleteOrder(orderId) {
    if (!confirm('Bestellung unwiderruflich löschen? Auch der zugehörige Zugangscode wird gelöscht.')) return;
    await sb.from('access_tokens').delete().eq('order_id', orderId);
    await sb.from('orders').delete().eq('id', orderId);
    await loadOrders();
  }

  function copyToken(orderId) {
    const val = document.getElementById('tv-' + orderId)?.textContent;
    if (!val) return;
    navigator.clipboard.writeText(val).then(() => alert('Token kopiert!'));
  }

  async function logout() { await sb.auth.signOut(); window.location.href = 'index.html'; }
  init();
</script>
</body>
</html>
