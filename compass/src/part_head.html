<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>eHealth Alliance Compass — Local</title>
<link rel="icon" type="image/svg+xml" href="assets/eHealthAllianceMark.svg" />
<link href="https://fonts.googleapis.com/css?family=Outfit:400,500|Inter:400,500|Montserrat" rel="stylesheet" crossorigin="anonymous">
<style>
:root{
  --eha-blue:#1C75BC; --eha-black:#000000; --eha-white:#FFFFFF; --eha-teal:#00A6CE;
  --eha-success:#128354; --eha-warning:#f1a425; --eha-error:#b00020; --eha-navy:#17356B;
  --compass-gradient:linear-gradient(to right,#00A6CE,#17356B);
  --eha-gradient:linear-gradient(to right,#17356B,#1C75BC 60%,#00A6CE);
  --eha-gradient-b:linear-gradient(to right,#17356B,#1C75BC 33%,#00A6CE 66%,#52B848);
  --line:#dddddd; --muted:#777;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Outfit,"Segoe UI",Arial,sans-serif;color:var(--eha-black);background:var(--eha-white)}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- MenuBar ---------- */
header.bar{background:var(--eha-navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.25)}
header.bar .inner{display:flex;align-items:center;gap:20px;height:64px}
header.bar img.logo{height:36px}
header.bar .brand{display:flex;align-items:center;gap:12px;font-size:20px;letter-spacing:.5px;cursor:pointer}
header.bar .brand b{font-weight:500}
header.bar nav{display:flex;gap:4px;margin-left:auto;align-items:center}
header.bar nav button{background:none;border:0;color:#ddd;font-size:15px;padding:8px 14px;border-radius:6px;cursor:pointer}
header.bar nav button:hover{background:rgba(255,255,255,.1);color:#fff}
header.bar nav button.active{color:#fff;background:rgba(255,255,255,.16)}
header.bar nav button:disabled{opacity:.35;cursor:not-allowed}
.langsw{display:flex;border:1px solid #666;border-radius:6px;overflow:hidden;margin-left:12px}
.langsw button{padding:6px 10px !important;border-radius:0 !important;font-size:13px}
.langsw button.on{background:var(--eha-blue) !important;color:#fff}

/* ---------- Hero / Home ---------- */
.hero{background:var(--eha-navy);color:#fff;padding:56px 0 64px}
.hero h1{font-size:44px;margin:0 0 8px;font-weight:500}
.hero .grad{background:var(--eha-gradient-b);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c9c9c9;font-size:17px;max-width:720px;line-height:1.55;font-family:Inter,sans-serif}
.hero .heroflex{display:flex;align-items:center;gap:40px}
.hero img.mark{width:270px;opacity:1}

.section{padding:40px 0}
.section h2{font-size:26px;font-weight:500;margin:0 0 4px}
.section .sub{color:var(--muted);font-family:Inter,sans-serif;margin:0 0 24px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.card{border:1px solid var(--line);border-radius:12px;padding:22px;background:#fff;transition:.15s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 6px 22px rgba(0,0,0,.09);transform:translateY(-2px)}
.card .icon{width:44px;height:44px;object-fit:contain;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:19px;font-weight:500}
.card p{margin:0 0 16px;color:#555;font-family:Inter,sans-serif;font-size:14px;line-height:1.5;flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:#555;font-family:Inter,sans-serif}

.btn{background:var(--eha-blue);color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:15px;cursor:pointer;transition:.15s}
.btn:hover{background:#155C96}
.btn.ghost{background:none;border:1px solid var(--eha-blue);color:var(--eha-blue)}
.btn.ghost:hover{background:#E8F2FA}
.btn.grey{background:#eee;color:#333;border:1px solid var(--line)}
.btn.grey:hover{background:#e2e2e2}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;color:#555;font-family:Inter,sans-serif}
.field input,.field textarea,.field select{border:1px solid #c4c4c4;border-radius:6px;padding:9px 11px;font-size:14px;font-family:Inter,sans-serif;color:#111;background:#fff}
.field input:focus,.field textarea:focus{outline:2px solid var(--eha-blue);outline-offset:-1px;border-color:transparent}
.field textarea{resize:vertical}

/* ---------- Assessment layout ---------- */
.assess{display:grid;grid-template-columns:290px 1fr;gap:28px;padding:28px 0 60px;align-items:start}
.sidebar{border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:88px}
.sidebar h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.catlist{list-style:none;margin:0;padding:0}
.catlist li{margin-bottom:2px}
.catlist button{width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13.5px;display:flex;gap:8px;align-items:center;line-height:1.3;font-family:Inter,sans-serif}
.catlist button:hover{background:#f4f4f4}
.catlist button.active{background:#E8F2FA;color:var(--eha-blue);font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:#d5d5d5;margin-top:3px}
.dot.done{background:var(--eha-success)}
.dot.partial{background:var(--eha-warning)}

.qhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:22px;gap:20px}
.qhead .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.qhead h2{margin:4px 0 0;font-size:22px;font-weight:500}
.qgrid{display:grid;grid-template-columns:1fr 1.25fr;gap:32px}
.qtext{font-family:Inter,sans-serif;font-size:15.5px;line-height:1.6;white-space:pre-line}
.src{color:#999;font-size:13px;margin-top:20px;font-family:Inter,sans-serif}
.reqbox{border-left:1px solid #ccc;padding-left:26px}
.reqbox .rhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px;gap:20px}
.reqbox .rhead span.t{font-size:18px}
.req{padding:14px 0;border-top:1px solid var(--line)}
.req:first-of-type{border-top:0}
.req .rtext{font-family:Inter,sans-serif;font-size:14px;line-height:1.5;margin-bottom:12px}
.req.off .rtext{opacity:.45;text-decoration:line-through}
.rrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.rating{display:flex;gap:6px}
.rating button{border:1px solid #c9c9c9;background:#fff;border-radius:6px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:Inter,sans-serif;color:#444}
.rating button:hover{border-color:#888}
.rating button.on{background:var(--eha-success);border-color:var(--eha-success);color:#fff}
.rating button.on.low{background:var(--eha-error);border-color:var(--eha-error);color:#fff}
.rating button.on.mid{background:var(--eha-warning);border-color:var(--eha-warning);color:#3a2a00}
.rating.off button{opacity:.35;pointer-events:none}
/* Auswahlfragen mit vier Reifegradstufen (Alliance Assessment) */
.choices{display:flex;flex-direction:column;gap:8px}
.choices button.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1px solid #c9c9c9;background:#fff;border-radius:8px;padding:12px 14px;cursor:pointer;font-family:Inter,sans-serif;font-size:14px;line-height:1.45;color:#333;transition:.12s}
.choices button.choice:hover{border-color:var(--eha-blue);background:#f7fbfe}
.choices button.choice .mark{flex:0 0 16px;width:16px;height:16px;border-radius:50%;border:2px solid #bbb;margin-top:1px;transition:.12s}
.choices button.choice .lbl{flex:1}
.choices button.choice .pts{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12px;color:#999;border:1px solid var(--line);border-radius:20px;padding:1px 9px;margin-top:1px}
.choices button.choice.on{color:#fff;border-color:transparent}
.choices button.choice.on .mark{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 3px currentColor}
.choices button.choice.on .pts{color:#fff;border-color:rgba(255,255,255,.5)}
.choices button.choice.on.good{background:var(--eha-success)}
.choices button.choice.on.mid{background:var(--eha-warning);color:#3a2a00}
.choices button.choice.on.mid .pts{color:#3a2a00;border-color:rgba(0,0,0,.25)}
.choices button.choice.on.mid .mark{box-shadow:inset 0 0 0 3px var(--eha-warning)}
.choices button.choice.on.low{background:var(--eha-error)}
.choices.off{opacity:.35;pointer-events:none}
.notrel{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#666;cursor:pointer;font-family:Inter,sans-serif;user-select:none}
.weight{font-size:12px;color:#999;font-family:Inter,sans-serif}

.progress{height:9px;background:#eee;border-radius:6px;overflow:hidden;width:100%}
.progress i{display:block;height:100%;background:var(--eha-success);transition:width .25s}
.progress.warn i{background:var(--eha-warning)}
.progress.bad i{background:var(--eha-error)}
.pctline{display:flex;justify-content:space-between;font-size:12.5px;color:#555;margin-bottom:5px;font-family:Inter,sans-serif;gap:14px}

.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:34px;padding-top:20px;border-top:1px solid var(--line);gap:14px}
.saved{color:var(--eha-success);font-size:13px;font-family:Inter,sans-serif}

/* ---------- Evaluation ---------- */
.evalhead{background:var(--eha-navy);color:#fff;padding:34px 0}
.evalhead h1{margin:0;font-size:32px;font-weight:500}
.evalhead .score{font-size:56px;font-weight:500;line-height:1}
.evalhead .scorewrap{display:flex;align-items:center;gap:34px;margin-top:18px;flex-wrap:wrap}
.evalhead .meta{color:#bbb;font-family:Inter,sans-serif;font-size:14px;line-height:1.7}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
table.cats{width:100%;border-collapse:collapse;font-family:Inter,sans-serif;font-size:14px}
table.cats th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
table.cats td{padding:11px 10px 11px 0;border-bottom:1px solid #f0f0f0;vertical-align:middle}
table.cats td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rec{border:1px solid var(--line);border-left:4px solid var(--eha-blue);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:#fff}
.rec h4{margin:0 0 6px;font-size:14px;font-weight:500}
.rec p{margin:0;font-family:Inter,sans-serif;font-size:13.5px;line-height:1.55;color:#444}
.summary{background:#f7f7f7;border-radius:10px;padding:20px 22px;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.65;white-space:pre-line}

/* ---------- Quiz ---------- */
.quiz{max-width:820px;margin:0 auto;padding:34px 0 60px}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin:22px 0}
.opt{border:1px solid #c9c9c9;background:#fff;border-radius:8px;padding:16px;font-size:15px;cursor:pointer;text-align:left;font-family:Inter,sans-serif;white-space:pre-line;transition:.12s}
.opt:hover:enabled{border-color:var(--eha-blue)}
.opt.correct{background:#e6f4ee;border-color:var(--eha-success);color:var(--eha-success)}
.opt.wrong{background:#fbe9ec;border-color:var(--eha-error);color:var(--eha-error)}
.opt:disabled{cursor:default;color:#555;opacity:1}
.opt.correct:disabled{color:var(--eha-success)}
.opt.wrong:disabled{color:var(--eha-error)}
.solution{border-left:4px solid var(--eha-success);background:#f7f7f7;border-radius:8px;padding:16px 18px;font-family:Inter,sans-serif;font-size:14px;line-height:1.6;white-space:pre-line}
.solution b{display:block;margin-bottom:6px}

.stepper{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px;font-family:Inter,sans-serif}
footer.foot{background:var(--eha-navy);color:#8f8f8f;font-family:Inter,sans-serif;font-size:12.5px;padding:22px 0;line-height:1.7}
.note{background:#fff8e6;border:1px solid #f0dca6;border-radius:8px;padding:12px 15px;font-family:Inter,sans-serif;font-size:13px;line-height:1.55;color:#5c4708}
@media print{header.bar,.navrow,.noprint{display:none !important}}
@media(max-width:980px){.assess{grid-template-columns:1fr}.sidebar{position:static}.qgrid,.twocol{grid-template-columns:1fr}.reqbox{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:20px}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
