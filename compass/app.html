<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>eHealth Alliance Compass — Local</title>
<link rel="icon" type="image/svg+xml" href="assets/eHealthAllianceMark.svg" />
<link href="https://fonts.googleapis.com/css?family=Outfit:400,500|Inter:400,500|Montserrat" rel="stylesheet" crossorigin="anonymous">
<style>
:root{
  --eha-blue:#1C75BC; --eha-black:#000000; --eha-white:#FFFFFF; --eha-teal:#00A6CE;
  --eha-success:#128354; --eha-warning:#f1a425; --eha-error:#b00020; --eha-navy:#17356B;
  --compass-gradient:linear-gradient(to right,#00A6CE,#17356B);
  --eha-gradient:linear-gradient(to right,#17356B,#1C75BC 60%,#00A6CE);
  --eha-gradient-b:linear-gradient(to right,#17356B,#1C75BC 33%,#00A6CE 66%,#52B848);
  --line:#dddddd; --muted:#777;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Outfit,"Segoe UI",Arial,sans-serif;color:var(--eha-black);background:var(--eha-white)}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- MenuBar ---------- */
header.bar{background:var(--eha-navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.25)}
header.bar .inner{display:flex;align-items:center;gap:20px;height:64px}
header.bar img.logo{height:36px}
header.bar .brand{display:flex;align-items:center;gap:12px;font-size:20px;letter-spacing:.5px;cursor:pointer}
header.bar .brand b{font-weight:500}
header.bar nav{display:flex;gap:4px;margin-left:auto;align-items:center}
header.bar nav button{background:none;border:0;color:#ddd;font-size:15px;padding:8px 14px;border-radius:6px;cursor:pointer}
header.bar nav button:hover{background:rgba(255,255,255,.1);color:#fff}
header.bar nav button.active{color:#fff;background:rgba(255,255,255,.16)}
header.bar nav button:disabled{opacity:.35;cursor:not-allowed}
.langsw{display:flex;border:1px solid #666;border-radius:6px;overflow:hidden;margin-left:12px}
.langsw button{padding:6px 10px !important;border-radius:0 !important;font-size:13px}
.langsw button.on{background:var(--eha-blue) !important;color:#fff}

/* ---------- Hero / Home ---------- */
.hero{background:var(--eha-navy);color:#fff;padding:56px 0 64px}
.hero h1{font-size:44px;margin:0 0 8px;font-weight:500}
.hero .grad{background:var(--eha-gradient-b);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c9c9c9;font-size:17px;max-width:720px;line-height:1.55;font-family:Inter,sans-serif}
.hero .heroflex{display:flex;align-items:center;gap:40px}
.hero img.mark{width:270px;opacity:1}

.section{padding:40px 0}
.section h2{font-size:26px;font-weight:500;margin:0 0 4px}
.section .sub{color:var(--muted);font-family:Inter,sans-serif;margin:0 0 24px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.card{border:1px solid var(--line);border-radius:12px;padding:22px;background:#fff;transition:.15s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 6px 22px rgba(0,0,0,.09);transform:translateY(-2px)}
.card .icon{width:44px;height:44px;object-fit:contain;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:19px;font-weight:500}
.card p{margin:0 0 16px;color:#555;font-family:Inter,sans-serif;font-size:14px;line-height:1.5;flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:#555;font-family:Inter,sans-serif}

.btn{background:var(--eha-blue);color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:15px;cursor:pointer;transition:.15s}
.btn:hover{background:#155C96}
.btn.ghost{background:none;border:1px solid var(--eha-blue);color:var(--eha-blue)}
.btn.ghost:hover{background:#E8F2FA}
.btn.grey{background:#eee;color:#333;border:1px solid var(--line)}
.btn.grey:hover{background:#e2e2e2}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;color:#555;font-family:Inter,sans-serif}
.field input,.field textarea,.field select{border:1px solid #c4c4c4;border-radius:6px;padding:9px 11px;font-size:14px;font-family:Inter,sans-serif;color:#111;background:#fff}
.field input:focus,.field textarea:focus{outline:2px solid var(--eha-blue);outline-offset:-1px;border-color:transparent}
.field textarea{resize:vertical}

/* ---------- Assessment layout ---------- */
.assess{display:grid;grid-template-columns:290px 1fr;gap:28px;padding:28px 0 60px;align-items:start}
.sidebar{border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:88px}
.sidebar h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.catlist{list-style:none;margin:0;padding:0}
.catlist li{margin-bottom:2px}
.catlist button{width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13.5px;display:flex;gap:8px;align-items:center;line-height:1.3;font-family:Inter,sans-serif}
.catlist button:hover{background:#f4f4f4}
.catlist button.active{background:#E8F2FA;color:var(--eha-blue);font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:#d5d5d5;margin-top:3px}
.dot.done{background:var(--eha-success)}
.dot.partial{background:var(--eha-warning)}

.qhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:22px;gap:20px}
.qhead .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.qhead h2{margin:4px 0 0;font-size:22px;font-weight:500}
.qgrid{display:grid;grid-template-columns:1fr 1.25fr;gap:32px}
.qtext{font-family:Inter,sans-serif;font-size:15.5px;line-height:1.6;white-space:pre-line}
.src{color:#999;font-size:13px;margin-top:20px;font-family:Inter,sans-serif}
.reqbox{border-left:1px solid #ccc;padding-left:26px}
.reqbox .rhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px;gap:20px}
.reqbox .rhead span.t{font-size:18px}
.req{padding:14px 0;border-top:1px solid var(--line)}
.req:first-of-type{border-top:0}
.req .rtext{font-family:Inter,sans-serif;font-size:14px;line-height:1.5;margin-bottom:12px}
.req.off .rtext{opacity:.45;text-decoration:line-through}
.rrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.rating{display:flex;gap:6px}
.rating button{border:1px solid #c9c9c9;background:#fff;border-radius:6px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:Inter,sans-serif;color:#444}
.rating button:hover{border-color:#888}
.rating button.on{background:var(--eha-success);border-color:var(--eha-success);color:#fff}
.rating button.on.low{background:var(--eha-error);border-color:var(--eha-error);color:#fff}
.rating button.on.mid{background:var(--eha-warning);border-color:var(--eha-warning);color:#3a2a00}
.rating.off button{opacity:.35;pointer-events:none}
/* Auswahlfragen mit vier Reifegradstufen (Alliance Assessment) */
.choices{display:flex;flex-direction:column;gap:8px}
.choices button.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1px solid #c9c9c9;background:#fff;border-radius:8px;padding:12px 14px;cursor:pointer;font-family:Inter,sans-serif;font-size:14px;line-height:1.45;color:#333;transition:.12s}
.choices button.choice:hover{border-color:var(--eha-blue);background:#f7fbfe}
.choices button.choice .mark{flex:0 0 16px;width:16px;height:16px;border-radius:50%;border:2px solid #bbb;margin-top:1px;transition:.12s}
.choices button.choice .lbl{flex:1}
.choices button.choice .pts{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12px;color:#999;border:1px solid var(--line);border-radius:20px;padding:1px 9px;margin-top:1px}
.choices button.choice.on{color:#fff;border-color:transparent}
.choices button.choice.on .mark{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 3px currentColor}
.choices button.choice.on .pts{color:#fff;border-color:rgba(255,255,255,.5)}
.choices button.choice.on.good{background:var(--eha-success)}
.choices button.choice.on.mid{background:var(--eha-warning);color:#3a2a00}
.choices button.choice.on.mid .pts{color:#3a2a00;border-color:rgba(0,0,0,.25)}
.choices button.choice.on.mid .mark{box-shadow:inset 0 0 0 3px var(--eha-warning)}
.choices button.choice.on.low{background:var(--eha-error)}
.choices.off{opacity:.35;pointer-events:none}
.notrel{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#666;cursor:pointer;font-family:Inter,sans-serif;user-select:none}
.weight{font-size:12px;color:#999;font-family:Inter,sans-serif}

.progress{height:9px;background:#eee;border-radius:6px;overflow:hidden;width:100%}
.progress i{display:block;height:100%;background:var(--eha-success);transition:width .25s}
.progress.warn i{background:var(--eha-warning)}
.progress.bad i{background:var(--eha-error)}
.pctline{display:flex;justify-content:space-between;font-size:12.5px;color:#555;margin-bottom:5px;font-family:Inter,sans-serif;gap:14px}

.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:34px;padding-top:20px;border-top:1px solid var(--line);gap:14px}
.saved{color:var(--eha-success);font-size:13px;font-family:Inter,sans-serif}

/* ---------- Evaluation ---------- */
.evalhead{background:var(--eha-navy);color:#fff;padding:34px 0}
.evalhead h1{margin:0;font-size:32px;font-weight:500}
.evalhead .score{font-size:56px;font-weight:500;line-height:1}
.evalhead .scorewrap{display:flex;align-items:center;gap:34px;margin-top:18px;flex-wrap:wrap}
.evalhead .meta{color:#bbb;font-family:Inter,sans-serif;font-size:14px;line-height:1.7}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
table.cats{width:100%;border-collapse:collapse;font-family:Inter,sans-serif;font-size:14px}
table.cats th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
table.cats td{padding:11px 10px 11px 0;border-bottom:1px solid #f0f0f0;vertical-align:middle}
table.cats td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rec{border:1px solid var(--line);border-left:4px solid var(--eha-blue);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:#fff}
.rec h4{margin:0 0 6px;font-size:14px;font-weight:500}
.rec p{margin:0;font-family:Inter,sans-serif;font-size:13.5px;line-height:1.55;color:#444}
.summary{background:#f7f7f7;border-radius:10px;padding:20px 22px;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.65;white-space:pre-line}

/* ---------- Quiz ---------- */
.quiz{max-width:820px;margin:0 auto;padding:34px 0 60px}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin:22px 0}
.opt{border:1px solid #c9c9c9;background:#fff;border-radius:8px;padding:16px;font-size:15px;cursor:pointer;text-align:left;font-family:Inter,sans-serif;white-space:pre-line;transition:.12s}
.opt:hover:enabled{border-color:var(--eha-blue)}
.opt.correct{background:#e6f4ee;border-color:var(--eha-success);color:var(--eha-success)}
.opt.wrong{background:#fbe9ec;border-color:var(--eha-error);color:var(--eha-error)}
.opt:disabled{cursor:default;color:#555;opacity:1}
.opt.correct:disabled{color:var(--eha-success)}
.opt.wrong:disabled{color:var(--eha-error)}
.solution{border-left:4px solid var(--eha-success);background:#f7f7f7;border-radius:8px;padding:16px 18px;font-family:Inter,sans-serif;font-size:14px;line-height:1.6;white-space:pre-line}
.solution b{display:block;margin-bottom:6px}

.stepper{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px;font-family:Inter,sans-serif}
footer.foot{background:var(--eha-navy);color:#8f8f8f;font-family:Inter,sans-serif;font-size:12.5px;padding:22px 0;line-height:1.7}
.note{background:#fff8e6;border:1px solid #f0dca6;border-radius:8px;padding:12px 15px;font-family:Inter,sans-serif;font-size:13px;line-height:1.55;color:#5c4708}
@media print{header.bar,.navrow,.noprint{display:none !important}}
@media(max-width:980px){.assess{grid-template-columns:1fr}.sidebar{position:static}.qgrid,.twocol{grid-template-columns:1fr}.reqbox{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:20px}.opts{grid-template-columns:1fr}}
</style>
</head>

/* =========================================================================
   Digital-Health-Quiz — KHZG, NIS2, TI, ePA
   10 Multiple-Choice-Fragen mit Auflösungstext. Struktur unverändert
   gegenüber dem Original (assessmentData.jsx), nur der Inhalt ist neu.
   ========================================================================= */
const COMPASS_QUIZ_SOURCE = [
  {
    index: 0,
    questionText:
      "Wie viel Fördervolumen stand über den Krankenhauszukunftsfonds (KHZG) insgesamt bereit?",
    optionA: "1,3 Mrd. €",
    optionB: "3,0 Mrd. €",
    optionC: "4,3 Mrd. €",
    optionD: "8,0 Mrd. €",
    correctOption: "optionC",
    solutionText:
      "Bis zu 4,3 Mrd. €: 3 Mrd. € vom Bund, bis zu 1,3 Mrd. € von Ländern und Trägern. Die Förderquote lag bei 70 % Bund zu 30 % Land oder Träger.\n\nAha: Mindestens 15 % der beantragten Mittel mussten in IT-Sicherheit fließen — das KHZG war damit auch das größte Cybersicherheitsprogramm, das die deutsche Krankenhauslandschaft je gesehen hat. Viele Häuser haben diese Quote als Pflichtübung abgehakt, statt sie als bezahlte Grundlage für das zu nutzen, was NIS2 heute ohnehin verlangt.",
  },
  {
    index: 1,
    questionText:
      "Was passiert seit 2025 mit Krankenhäusern, die die KHZG-Muss-Kriterien nicht erfüllen?",
    optionA: "Nichts, die Förderung verfällt lediglich",
    optionB: "Abschlag von bis zu 2 % des Rechnungsbetrags je vollstationärem Fall",
    optionC: "Einmalige Geldbuße von 50.000 €",
    optionD: "Rückzahlung der erhaltenen Fördermittel",
    correctOption: "optionB",
    solutionText:
      "Seit dem 1. Januar 2025 greift ein Abschlag von bis zu 2 % des Rechnungsbetrags je vollstationärem Fall (§ 5 Abs. 3h KHEntgG), wenn die Muss-Kriterien der Fördertatbestände 2 bis 6 nicht erfüllt sind.\n\nAha: Das ist keine einmalige Buße, sondern trifft die laufenden Erlöse — dauerhaft. Bei einem Haus mit 100 Mio. € Erlös sind das bis zu 2 Mio. € pro Jahr. Die Digitalisierung nicht zu machen ist damit teurer, als sie zu machen.",
  },
  {
    index: 2,
    questionText:
      "Wie hoch können Bußgelder für „wesentliche Einrichtungen\" nach NIS2 maximal ausfallen?",
    optionA: "500.000 €",
    optionB: "2 Mio. € oder 1 % des Jahresumsatzes",
    optionC: "10 Mio. € oder 2 % des weltweiten Jahresumsatzes",
    optionD: "20 Mio. € oder 4 % des Jahresumsatzes",
    correctOption: "optionC",
    solutionText:
      "Bis zu 10 Mio. € oder 2 % des weltweiten Jahresumsatzes — je nachdem, welcher Betrag höher ist. Für „wichtige Einrichtungen\" sind es bis zu 7 Mio. € oder 1,4 %.\n\nAha: Der eigentliche Unterschied zur DSGVO ist nicht die Höhe, sondern die Adressierung. NIS2 nimmt die Geschäftsleitung persönlich in die Pflicht: Sie muss die Risikomanagementmaßnahmen billigen, ihre Umsetzung überwachen und sich dafür schulen lassen. IT-Sicherheit ist damit endgültig kein Thema mehr, das man an die IT-Abteilung delegieren kann.",
  },
  {
    index: 3,
    questionText:
      "Wie schnell muss ein erheblicher Sicherheitsvorfall nach NIS2 erstmals gemeldet werden?",
    optionA: "Innerhalb von 24 Stunden",
    optionB: "Innerhalb von 72 Stunden",
    optionC: "Innerhalb von 7 Tagen",
    optionD: "Innerhalb von 30 Tagen",
    correctOption: "optionA",
    solutionText:
      "Dreistufig: Frühwarnung binnen 24 Stunden, vollständige Meldung binnen 72 Stunden, Abschlussbericht binnen eines Monats.\n\nAha: Die 24 Stunden laufen ab Kenntnis des Vorfalls — nicht ab dem Zeitpunkt, an dem man verstanden hat, was passiert ist. Wer am Montagmorgen bemerkt, was am Freitagabend begann, hat die Frist fast aufgebraucht, bevor die erste Analyse steht. Ohne vorbereiteten Meldeprozess mit benannten Verantwortlichen ist sie praktisch nicht zu halten.",
  },
  {
    index: 4,
    questionText:
      "Welche Krankenhäuser müssen IT-Sicherheit nach dem Stand der Technik umsetzen?",
    optionA: "Nur KRITIS-Häuser ab 30.000 vollstationären Fällen",
    optionB: "Alle Krankenhäuser",
    optionC: "Nur Universitätskliniken",
    optionD: "Nur Häuser, die KHZG-Mittel erhalten haben",
    correctOption: "optionB",
    solutionText:
      "§ 75c SGB V verpflichtet seit dem 1. Januar 2022 alle Krankenhäuser, angemessene organisatorische und technische Vorkehrungen nach dem Stand der Technik zu treffen — unabhängig von Größe, Trägerschaft und KRITIS-Status.\n\nAha: Die vielzitierte 30.000-Fälle-Schwelle entscheidet nur darüber, wem gegenüber man es nachweisen muss, nicht darüber, ob man es tun muss. Ein Haus mit 15.000 Fällen ist genauso in der Pflicht — es muss es nur niemandem beweisen. Bis etwas passiert.",
  },
  {
    index: 5,
    questionText:
      "Wie viele gesetzlich Versicherte haben der elektronischen Patientenakte widersprochen?",
    optionA: "Unter 5 %",
    optionB: "Rund 15 %",
    optionC: "Rund 30 %",
    optionD: "Über 50 %",
    correctOption: "optionA",
    solutionText:
      "Die Widerspruchsquote blieb im niedrigen einstelligen Prozentbereich. Rund 70 Millionen Akten wurden automatisch angelegt.\n\nAha: Zehn Jahre Freiwilligkeit brachten die ePA auf etwa 1 % Verbreitung. Eine einzige Änderung — von Opt-in auf Opt-out — brachte sie in wenigen Monaten über 95 %. Nicht die Technik war das Hindernis, sondern die Voreinstellung.",
  },
  {
    index: 6,
    questionText:
      "Welche Branche verzeichnet weltweit die höchsten Kosten pro Datenleck?",
    optionA: "Finanzsektor",
    optionB: "Energieversorgung",
    optionC: "Öffentliche Verwaltung",
    optionD: "Gesundheitswesen",

/* ----------------------------------------------------- Bewertungslogik ---- */
/* identisch zu StandardAssessment.calculatePercentage() */
function computeRating(question, answer) {
  let sum = 0, total = 0;
  for (const req of Object.values(question.requirements || {})) {
    const a = answer?.requirementAnswers?.[req.id];
    if (a?.disabled) continue;
    total += Number(req.weight);
    const f = a?.fulfilled || 0;
    if (f) {
      if (req.discreteOptions) sum += (Number(req.weight) * Number(f)) / 3;
      else sum += Number(req.weight);
    }
  }
  return total ? (sum / total) * 100 : 0;
}
const hasAnswer = (qid) => !!S.answers[qid];
function answerOf(qid) {
  if (!S.answers[qid]) S.answers[qid] = { requirementAnswers: {}, responsibleRole: "", answerText: "" };
  return S.answers[qid];
}

/* Kategorie-Aggregation — analog Lambda ComputeEvaluation */
function evaluate(mod) {
  const byCat = mod.categories.map((c, i) => {
    const rows = c.questions.map((q) => {
      const a = S.answers[q.id];
      return { q, a, rating: a ? Math.round(computeRating(q, a)) : 0, answered: !!a };
    });
    const totalRating = rows.reduce((acc, r) => acc + r.rating, 0);
    const maxRating = rows.length * 100;
    const recommendations = [];
    rows.forEach((r) => {
      if (!r.a) return;
      Object.values(r.q.requirements || {}).forEach((req) => {
        const ra = r.a.requirementAnswers?.[req.id];
        if (!ra || ra.disabled) return;
        const f = ra.fulfilled || 0;
        const weak = req.discreteOptions ? Number(f) <= 1 : !f;
        if (weak && req.solution) {
          recommendations.push({ category: c.name, question: r.q.content, solution: req.solution });
        }
      });
    });
    return {
      categoryId: c.id, name: c.name, index: i + 1, rows,
      totalRating, maxRating, recommendations,
      completelyAnswered: rows.every((r) => r.answered),
      answeredCount: rows.filter((r) => r.answered).length,
      totalRatingInPercent: maxRating ? totalRating / maxRating : 0,
    };
  });
  const answeredCats = byCat.filter((c) => c.answeredCount > 0);
  const totalRating = answeredCats.reduce((a, c) => a + c.totalRating, 0);
  const maxRating = answeredCats.reduce((a, c) => a + c.rows.filter((r) => r.answered).length * 100, 0);
  return {
    byCat, answeredCats, totalRating, maxRating,
    overall: maxRating ? (totalRating / maxRating) * 100 : 0,
    complete: byCat.every((c) => c.completelyAnswered),
    recommendations: byCat.flatMap((c) => c.recommendations),
  };
}

/* Ersetzt den GPT-Fließtext des Originals durch eine deterministische,
   lokal erzeugte Zusammenfassung nach demselben Prompt-Aufbau.            */
function summaryText(mod, ev) {
  const de = S.lang === "DE";
  const pct = (x) => Math.round(x * 100) + "%";
  const sorted = [...ev.answeredCats].sort((a, b) => b.totalRatingInPercent - a.totalRatingInPercent);
  if (!sorted.length) return de ? "Es liegen noch keine bewerteten Fragen vor." : "No rated questions yet.";
  const strong = sorted.filter((c) => c.totalRatingInPercent >= 0.67).map((c) => c.name);
  const weak = sorted.filter((c) => c.totalRatingInPercent < 0.34).map((c) => c.name);
  const mid = sorted.filter((c) => c.totalRatingInPercent >= 0.34 && c.totalRatingInPercent < 0.67).map((c) => c.name);
  const list = (arr) => arr.join(de ? ", " : ", ");
  let s = "";
  if (de) {
    s += `Das Assessment „${mod.name}" wurde für ${S.customer || "den Mandanten"} mit ${ev.answeredCats.reduce((a, c) => a + c.answeredCount, 0)} bewerteten Fragen in ${ev.answeredCats.length} Kategorien durchgeführt. `;
    s += `Das Gesamtergebnis liegt bei ${Math.round(ev.overall)}% (${ev.totalRating} von ${ev.maxRating} Punkten).\n\n`;
    if (strong.length) s += `Stärken zeigen sich in: ${list(strong)}. Diese Bereiche sind weitgehend oder vollständig erfüllt und sollten auf dem erreichten Niveau gehalten werden.\n\n`;
    if (mid.length) s += `Teilweise erfüllt sind: ${list(mid)}. Hier bestehen Ansatzpunkte zur Verbesserung mit überschaubarem Aufwand.\n\n`;
    if (weak.length) s += `Deutlichen Handlungsbedarf gibt es in: ${list(weak)}. Diese Kategorien sollten priorisiert adressiert werden.\n\n`;
    s += `Insgesamt wurden ${ev.recommendations.length} Handlungsempfehlung(en) abgeleitet.`;
  } else {
    s += `The "${mod.name}" assessment was carried out for ${S.customer || "the customer"} with ${ev.answeredCats.reduce((a, c) => a + c.answeredCount, 0)} rated questions across ${ev.answeredCats.length} categories. `;
    s += `The overall result is ${Math.round(ev.overall)}% (${ev.totalRating} out of ${ev.maxRating} points).\n\n`;
    if (strong.length) s += `Strengths are found in: ${list(strong)}. These areas are largely or fully fulfilled and should be kept at the level reached.\n\n`;
    if (mid.length) s += `Partially fulfilled: ${list(mid)}. There is room for improvement here with moderate effort.\n\n`;
    if (weak.length) s += `Clear need for action in: ${list(weak)}. These categories should be addressed with priority.\n\n`;
    s += `In total ${ev.recommendations.length} recommendation(s) were derived.`;
  }
  return s;
}

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const barClass = (pct) => (pct >= 67 ? "" : pct >= 34 ? "warn" : "bad");

function progressBar(pct, cls) {
  return `<div class="progress ${cls != null ? cls : barClass(pct)}"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`;
}

/* Radar-Chart (ersetzt recharts <RadarChart> des Originals) */
function radarChart(cats) {
  const n = cats.length;
  if (n < 3) return "";
  const size = 460, cx = size / 2, cy = size / 2 + 6, R = 150;
  const ang = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  const pt = (i, r) => [cx + Math.cos(ang(i)) * R * r, cy + Math.sin(ang(i)) * R * r];
  let g = "";
  [0.25, 0.5, 0.75, 1].forEach((r) => {
    const p = cats.map((_, i) => pt(i, r).join(",")).join(" ");
    g += `<polygon points="${p}" fill="none" stroke="#e2e2e2" stroke-width="1"/>`;
  });
  cats.forEach((_, i) => {
    const [x, y] = pt(i, 1);
    g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e2e2e2" stroke-width="1"/>`;
  });
  const poly = cats.map((c, i) => pt(i, Math.max(0.02, c.totalRatingInPercent)).join(",")).join(" ");
  g += `<polygon points="${poly}" fill="#1C75BC" fill-opacity="0.22" stroke="#1C75BC" stroke-width="2"/>`;
  cats.forEach((c, i) => {
    const [x, y] = pt(i, Math.max(0.02, c.totalRatingInPercent));
    g += `<circle cx="${x}" cy="${y}" r="3.5" fill="#1C75BC"/>`;
  });
  cats.forEach((c, i) => {
    const [x, y] = pt(i, 1.15);
    const anchor = Math.abs(x - cx) < 12 ? "middle" : x > cx ? "start" : "end";
    const label = c.name.length > 22 ? c.name.slice(0, 21) + "…" : c.name;
    g += `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" font-size="11" fill="#555" font-family="Inter,sans-serif">${esc(label)}</text>`;
  });
  // Seitenrand groß genug, damit die längsten Kategorienamen links/rechts nicht abschneiden
  const pad = 130;
  return `<svg viewBox="${-pad} 0 ${size + pad * 2} ${size + 20}" width="100%" style="max-width:700px">${g}</svg>`;
}

/* ------------------------------------------------------------ Views ------ */
function moduleCard(mod) {
  const qs = allQuestions(mod);
  const answered = qs.filter((q) => hasAnswer(q.id)).length;
  return `<div class="card">
    <img class="icon" src="${mod.icon}" alt="">
    <h3>${esc(mod.name)}</h3>
    <p>${esc(mod.introText[S.lang])}</p>
    <div class="chips">
      <span class="chip">${qs.length} ${esc(t("questions"))}</span>
      <span class="chip">${mod.categories.length} ${esc(t("categories"))}</span>
      <span class="chip">${esc(mod.version)}</span>
      ${mod.owner ? `<span class="chip">${esc(mod.owner)}</span>` : ""}
      <span class="chip">${answered}/${qs.length} ${esc(t("answered"))}</span>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn" data-act="start" data-mod="${mod.id}">${answered ? esc(t("cont")) : esc(t("start"))}</button>
      ${answered ? `<button class="btn ghost" data-act="evalmod" data-mod="${mod.id}">${esc(t("nav_eval"))}</button>` : ""}
    </div>
  </div>`;
}

function viewHome() {
  return `
  <div class="hero"><div class="wrap heroflex">
    <img class="mark" src="assets/eHealthAllianceWhite.svg" alt="eHealth Alliance">
    <div>
      <h1><span class="grad">Compass</span></h1>
      <p>${esc(t("hero_sub"))}</p>
    </div>
  </div></div>
  <div class="wrap section">
    <h2>${esc(t("modules"))}</h2>
    <p class="sub">${esc(t("modules_sub"))}</p>
    <div class="field" style="max-width:420px">
      <label for="cust">${esc(t("customer"))}</label>
      <input id="cust" data-inp="customer" value="${esc(S.customer)}" placeholder="${esc(t("customer_ph"))}">
    </div>
    <div class="cards">
      ${Object.values(MODULES).map(moduleCard).join("")}
      <div class="card">
        <img class="icon" src="assets/eHealthAllianceMark.svg" alt="">
        <h3>Digital-Health-Quiz</h3>
        <p>${S.lang === "DE"
      ? "Zehn Fragen zu KHZG, NIS2, ePA und TI — jede mit einer Auflösung, die mehr erklärt als nur die richtige Antwort. Gut als Einstieg in ein Kundengespräch."

function viewAssessment() {
  const mod = currentModule();
  const cats = mod.categories;
  const cat = cats[Math.max(0, Math.min(S.catIndex, cats.length - 1))];
  const qs = allQuestions(mod);
  const answered = qs.filter((q) => hasAnswer(q.id)).length;
  const overallPct = (answered / qs.length) * 100;

  const side = cats.map((c, i) => {
    const done = c.questions.filter((q) => hasAnswer(q.id)).length;
    const cls = done === c.questions.length ? "done" : done > 0 ? "partial" : "";
    return `<li><button class="${i === S.catIndex ? "active" : ""}" data-act="cat" data-i="${i}">
      <span class="dot ${cls}"></span><span>${esc(c.name)}</span></button></li>`;
  }).join("");

  const body = cat.questions.map((q) => {
    const a = S.answers[q.id];
    const pct = a ? computeRating(q, a) : 0;
    const reqs = Object.values(q.requirements || {}).sort((x, y) => y.weight - x.weight);
    // Auswahlfrage: genau ein Requirement mit vorgegebenen Reifegradstufen
    const isChoice = reqs.length === 1 && !!reqs[0].levels;
    const reqHtml = reqs.map((req) => {
      const ra = a?.requirementAnswers?.[req.id] || {};
      const off = !!ra.disabled;
      const f = Number(ra.fulfilled || 0);
      const showText = req.text !== q.content;
      const answeredQ = hasAnswer(q.id);

      // Auswahlfrage mit eigenen Stufenbeschriftungen (Alliance Assessment)
      if (req.levels) {
        const choices = req.levels.map((lv) => {
          const on = answeredQ && f === lv.value;
          const tone = lv.value <= 1 ? "low" : lv.value === 2 ? "mid" : "good";
          return `<button class="choice ${on ? "on " + tone : ""}" data-act="rate" data-q="${q.id}" data-r="${req.id}" data-v="${lv.value}">
            <span class="mark"></span><span class="lbl">${esc(lv.label)}</span><span class="pts">${lv.value}</span>
          </button>`;
        }).join("");
        return `<div class="req ${off ? "off" : ""}">
          <div class="choices ${off ? "off" : ""}">${choices}</div>
          <div class="rrow" style="margin-top:12px">
            <label class="notrel"><input type="checkbox" data-act="disable" data-q="${q.id}" data-r="${req.id}" ${off ? "checked" : ""}> ${esc(t("not_relevant"))}</label>
            <span class="weight">${esc(t("target"))}: ${esc(req.levels[0].label)}</span>
          </div>
        </div>`;
      }

      const btns = [0, 1, 2, 3].map((v) => {
        const on = f === v && (answeredQ || v > 0);
        const tone = v === 0 ? "low" : v === 1 ? "low" : v === 2 ? "mid" : "";
        return `<button class="${on ? "on " + tone : ""}" data-act="rate" data-q="${q.id}" data-r="${req.id}" data-v="${v}">${esc(ratingLabel(v))}</button>`;
      }).join("");
      return `<div class="req ${off ? "off" : ""}">
        ${showText ? `<div class="rtext">${esc(req.text)}</div>` : ""}
        <div class="rrow">
          <div class="rating ${off ? "off" : ""}">${btns}</div>
          <label class="notrel"><input type="checkbox" data-act="disable" data-q="${q.id}" data-r="${req.id}" ${off ? "checked" : ""}> ${esc(t("not_relevant"))}</label>
          <span class="weight">${esc(t("weight"))}: ${esc(req.weight)}</span>
        </div>
      </div>`;
    }).join("");

    return `<div class="qgrid">
      <div>
        <div class="qtext">${esc(q.content)}</div>
        <div style="margin-top:26px">
          <div class="field">
            <label>${esc(t("contact"))}</label>
            <input data-inp="role" data-q="${q.id}" value="${esc(a?.responsibleRole || "")}">
          </div>
          <div class="field">
            <label>${esc(t("comments"))}</label>
            <textarea rows="5" data-inp="text" data-q="${q.id}">${esc(a?.answerText || "")}</textarea>
          </div>
        </div>
        ${q.source ? `<div class="src">${esc(t("source"))} ${esc(q.source)}</div>` : ""}
      </div>
      <div class="reqbox">
        <div class="rhead">
          <span class="t">${esc(isChoice ? t("your_answer") : t("requirements"))}</span>
          <div style="min-width:210px">
            <div class="pctline"><span>${esc(isChoice ? t("maturity") : t("fulfilled_pct"))}</span><b>${Math.round(pct)}%</b></div>
            ${progressBar(pct)}
          </div>
        </div>
        ${reqHtml}
      </div>
    </div>`;
  }).join("");

  return `
  <div class="wrap assess">
    <aside class="sidebar">
      ${Object.keys(MODULES).length > 1 ? `
      <h4>${esc(t("modules"))}</h4>
      <div class="field" style="margin-bottom:18px">
        <select data-inp="module">
          ${Object.values(MODULES).map((m) =>
      `<option value="${m.id}" ${m.id === mod.id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}
        </select>
      </div>` : ""}
      <h4>${esc(t("categories"))}</h4>
      <ul class="catlist">${side}</ul>
      <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
        <div class="pctline"><span>${esc(t("progress"))}</span><b>${answered}/${qs.length}</b></div>
        ${progressBar(overallPct, overallPct === 100 ? "" : "warn")}
      </div>
      <button class="btn ghost sm" style="margin-top:16px;width:100%" data-act="goto" data-view="evaluation">${esc(t("to_eval"))}</button>
      <button class="btn grey sm" style="margin-top:8px;width:100%" data-act="reset">${esc(t("reset"))}</button>
    </aside>
    <section>
      <div class="qhead">
        <div>
          <div class="kicker">${esc(t("category"))} ${S.catIndex + 1} / ${cats.length} · ${esc(mod.name)}</div>
          <h2>${esc(cat.name)}</h2>
        </div>
        <div class="stepper">${S.customer ? esc(S.customer) : ""}</div>
      </div>
      ${body}
      <div class="navrow">
        <button class="btn grey" data-act="prev" ${S.catIndex === 0 ? "disabled" : ""}>← ${esc(t("prev"))}</button>
        <div style="display:flex;align-items:center;gap:14px">
          <span class="saved">${esc(S.flash)}</span>
          <button class="btn ghost" data-act="save">${esc(t("save"))}</button>
        </div>
        ${S.catIndex === cats.length - 1
      ? `<button class="btn" data-act="goto" data-view="evaluation">${esc(t("to_eval"))} →</button>`
      : `<button class="btn" data-act="next">${esc(t("next"))} →</button>`}
      </div>
    </section>
  </div>`;
}

function viewEvaluation() {
  const mod = currentModule();
  const ev = evaluate(mod);
  const rows = ev.byCat.map((c) => {
    const pct = c.totalRatingInPercent * 100;
    const status = c.completelyAnswered ? t("completely") : c.answeredCount ? t("partially") : t("open");
    return `<tr>
      <td>${esc(c.name)}<div style="color:#999;font-size:12px">${esc(status)}</div></td>
      <td style="width:38%">${progressBar(pct)}</td>
      <td class="num">${Math.round(pct)}%</td>
      <td class="num" style="color:#888">${c.totalRating}/${c.maxRating}</td>
    </tr>`;
  }).join("");

  const recs = ev.recommendations.length
    ? ev.recommendations.map((r) => `<div class="rec">
        <h4>${esc(r.category)}</h4>
        <p>${esc(r.solution)}</p></div>`).join("")
    : `<div class="summary">${esc(t("no_recs"))}</div>`;

  return `
  <div class="evalhead"><div class="wrap">
    <h1>${esc(t("eval_title"))} — ${esc(mod.name)}</h1>
    <div class="scorewrap">
      <div><div class="score">${Math.round(ev.overall)}%</div></div>
      <div class="meta">
        ${esc(t("overall"))}: <b style="color:#fff">${ev.totalRating}</b> ${esc(t("score_of"))} ${ev.maxRating} ${esc(t("points"))}<br>
        ${esc(t("customer"))}: <b style="color:#fff">${esc(S.customer || "—")}</b><br>
        ${ev.answeredCats.reduce((a, c) => a + c.answeredCount, 0)} / ${allQuestions(mod).length} ${esc(t("answered"))}
      </div>
    </div>
  </div></div>
  <div class="wrap section">
    ${!ev.complete ? `<div class="note" style="margin-bottom:26px">${esc(t("incomplete"))}</div>` : ""}
    <div class="twocol">
      <div>
        <h2 style="font-size:20px;margin:0 0 16px">${esc(t("result_by_cat"))}</h2>
        <table class="cats">
          <thead><tr><th>${esc(t("category"))}</th><th></th><th class="num">%</th><th class="num">${esc(t("points"))}</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="text-align:center">${radarChart(ev.byCat)}</div>
    </div>
    <div style="margin-top:44px">
      <h2 style="font-size:20px;margin:0 0 16px">${esc(t("summary"))}</h2>
      <div class="summary">${esc(summaryText(mod, ev))}</div>
    </div>
    <div style="margin-top:44px">
      <h2 style="font-size:20px;margin:0 0 16px">${esc(t("recommendations"))} ${ev.recommendations.length ? `(${ev.recommendations.length})` : ""}</h2>
      ${recs}
    </div>
    <div class="navrow noprint">
      <button class="btn grey" data-act="goto" data-view="assessment">← ${esc(t("back_assessment"))}</button>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" data-act="export">${esc(t("export"))}</button>
        <button class="btn" data-act="print">${esc(t("print"))}</button>
      </div>
    </div>
  </div>`;
}

function viewQuiz() {
  const total = COMPASS_QUIZ_SOURCE.length;
  const i = S.quiz.index;
  if (S.quiz.done || i >= total) {
    const correct = COMPASS_QUIZ_SOURCE.filter((q) => S.quiz.chosen[q.index] === q.correctOption).length;
    return `<div class="wrap quiz" style="text-align:center">
      <img src="assets/eHealthAllianceMark.svg" style="width:90px" alt="">
      <h1 style="font-weight:500;margin:18px 0 6px">${esc(t("quiz_result"))}</h1>
      <div style="font-size:56px;font-weight:500;color:var(--eha-blue)">${correct}/${total}</div>
      <p style="font-family:Inter,sans-serif;color:#555">${esc(t("quiz_correct"))}</p>
      <div style="margin-top:24px;display:flex;gap:10px;justify-content:center">
        <button class="btn ghost" data-act="quizreset">${esc(t("quiz_again"))}</button>
        <button class="btn" data-act="goto" data-view="home">${esc(t("nav_home"))}</button>
      </div>
    </div>`;
  }
  const q = COMPASS_QUIZ_SOURCE[i];
  const chosen = S.quiz.chosen[q.index];
  const keys = ["optionA", "optionB", "optionC", "optionD"];
  const opts = keys.map((k) => {
    let cls = "";
    if (chosen) cls = k === q.correctOption ? "correct" : k === chosen ? "wrong" : "";
    return `<button class="opt ${cls}" data-act="quizpick" data-k="${k}" ${chosen ? "disabled" : ""}>${esc(q[k])}</button>`;
  }).join("");
  return `<div class="wrap quiz">
    <div class="stepper" style="justify-content:space-between;display:flex">
      <span>${esc(t("quiz_q"))} ${i + 1} ${esc(t("quiz_of"))} ${total}</span>
      <span>Digital-Health-Quiz</span>
    </div>
    ${progressBar(((i) / total) * 100, "")}
    <h2 style="font-weight:500;font-size:26px;margin:22px 0 0">${esc(q.questionText)}</h2>
    <div class="opts">${opts}</div>
    ${chosen ? `<div class="solution"><b>${esc(t("quiz_solution"))}</b>${esc(q.solutionText)}</div>
      <div class="navrow"><span></span><button class="btn" data-act="quiznext">${i + 1 === total ? esc(t("quiz_result")) : esc(t("quiz_next"))} →</button></div>` : ""}
  </div>`;
}

/* ------------------------------------------------------------ Shell ------ */
function header() {
  const nav = [
    ["home", t("nav_home")],
    ["assessment", t("nav_assessment")],
    ["evaluation", t("nav_eval")],
    ["quiz", t("nav_quiz")],
  ].map(([v, label]) =>
    `<button class="${S.view === v ? "active" : ""}" data-act="goto" data-view="${v}">${esc(label)}</button>`
  ).join("");
  return `<header class="bar"><div class="wrap inner">
    <div class="brand" data-act="goto" data-view="home">
      <img class="logo" src="assets/eHealthAllianceMark.svg" alt="eHealth Alliance Compass">
      <span>eHealth Alliance <b>Compass</b></span>
    </div>
    <nav>${nav}
      <span class="langsw">
        <button class="${S.lang === "DE" ? "on" : ""}" data-act="lang" data-l="DE">DE</button>
        <button class="${S.lang === "EN" ? "on" : ""}" data-act="lang" data-l="EN">EN</button>
      </span>
    </nav>
  </div></header>`;
}
const footer = () => `<footer class="foot"><div class="wrap">
  eHealth Alliance Compass — lokale Instanz · Fragenkatalog und Bewertungslogik aus dem Compass-Repository ·
  ${new Date().getFullYear()} eHealth Alliance
</div></footer>`;

function render() {
  let main = "";
  if (S.view === "assessment") { S.moduleId = currentModule().id; main = viewAssessment(); }
  else if (S.view === "evaluation") { S.moduleId = currentModule().id; main = viewEvaluation(); }
  else if (S.view === "quiz") main = viewQuiz();
  else main = viewHome();
  document.getElementById("app").innerHTML = header() + main + footer();
  document.title = "eHealth Alliance Compass — " + (S.view === "home" ? "Start" : t("nav_" + (S.view === "assessment" ? "assessment" : S.view === "evaluation" ? "eval" : "quiz")));
}

/* ------------------------------------------------------------ Events ----- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const mod = currentModule();

  if (act === "goto") { S.view = el.dataset.view; S.flash = ""; window.scrollTo(0, 0); }
  else if (act === "start") { S.moduleId = el.dataset.mod; S.view = "assessment"; S.catIndex = 0; persist(); window.scrollTo(0, 0); }
  else if (act === "evalmod") { S.moduleId = el.dataset.mod; S.view = "evaluation"; persist(); window.scrollTo(0, 0); }
  else if (act === "switchmod") { S.moduleId = el.dataset.mod; S.catIndex = 0; S.flash = ""; persist(); window.scrollTo(0, 0); }
  else if (act === "lang") { S.lang = el.dataset.l; persist(); }
  else if (act === "cat") { S.catIndex = Number(el.dataset.i); S.flash = ""; window.scrollTo(0, 0); }
  else if (act === "prev") { S.catIndex = Math.max(0, S.catIndex - 1); S.flash = ""; window.scrollTo(0, 0); }
  else if (act === "next") { S.catIndex = Math.min(mod.categories.length - 1, S.catIndex + 1); S.flash = ""; window.scrollTo(0, 0); }
  else if (act === "rate") {
    const a = answerOf(el.dataset.q);
    const cur = a.requirementAnswers[el.dataset.r] || {};
    a.requirementAnswers[el.dataset.r] = { ...cur, fulfilled: Number(el.dataset.v), disabled: !!cur.disabled };
    persist(); S.flash = "";
  }
  else if (act === "disable") {
    const a = answerOf(el.dataset.q);
    const cur = a.requirementAnswers[el.dataset.r] || { fulfilled: 0 };
    a.requirementAnswers[el.dataset.r] = { ...cur, disabled: !cur.disabled };
    persist(); S.flash = "";
  }
  else if (act === "save") { persist(); S.flash = t("saved"); }
  else if (act === "reset") {
    if (!confirm(t("reset_confirm"))) return;
    allQuestions(mod).forEach((q) => delete S.answers[q.id]);
    persist();
  }
  else if (act === "print") { window.print(); return; }
  else if (act === "export") { exportJson(mod); return; }
  else if (act === "quizpick") { S.quiz.chosen[COMPASS_QUIZ_SOURCE[S.quiz.index].index] = el.dataset.k; persist(); }
  else if (act === "quiznext") {
    if (S.quiz.index + 1 >= COMPASS_QUIZ_SOURCE.length) S.quiz.done = true;
    else S.quiz.index++;
    persist(); window.scrollTo(0, 0);
  }
  else if (act === "quizreset") { S.quiz = { index: 0, chosen: {}, done: false }; persist(); }
  else return;
  render();
});

document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-inp]");
  if (!el) return;
  const kind = el.dataset.inp;
  if (kind === "module") {
    S.moduleId = el.value; S.catIndex = 0; S.flash = "";
    persist(); render(); window.scrollTo(0, 0); return;
  }
  if (kind === "customer") S.customer = el.value;
  else if (kind === "role") answerOf(el.dataset.q).responsibleRole = el.value;
  else if (kind === "text") answerOf(el.dataset.q).answerText = el.value;
  persist();
});

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && (e.key === "s" || e.key === "S")) {
    e.preventDefault(); persist(); S.flash = t("saved"); render();
  }
});

function exportJson(mod) {
  const ev = evaluate(mod);
  const payload = {
    exportedAt: new Date().toISOString(),
    customer: S.customer, module: mod.name, language: S.lang,
    overallPercent: Math.round(ev.overall),
    totalRating: ev.totalRating, maxRating: ev.maxRating,
    dataByCategory: ev.byCat.map((c) => ({
      categoryId: c.categoryId, name: c.name,
      totalRating: c.totalRating, maxRating: c.maxRating,
      totalRatingInPercent: c.totalRatingInPercent,
      completelyAnswered: c.completelyAnswered,
      questionsData: c.rows.filter((r) => r.answered).map((r) => ({
        questionId: r.q.id, content: r.q.content, rating: r.rating,
        responsibleRole: r.a.responsibleRole || "", answerText: r.a.answerText || "",
      })),
    })),
    recommendations: ev.recommendations,
    introText: summaryText(mod, ev),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "compass-evaluation-" + (S.customer || "export").replace(/[^\w\-]+/g, "_") + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

restore();
render();
</script>
